[project]
name = "online-finetune-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mypy-protobuf==5.1.0"]

[tool.uv]
concurrent-downloads = 4

[tool.uv.extra-build-dependencies]
antlr4-python3-runtime = ["setuptools"]

[[tool.uv.dependency-metadata]]
name = "ultralytics"
version = "8.4.58"
requires-dist = [
  "matplotlib>=3.3.0",
  "numpy>=1.23.0",
  "opencv-python>=4.6.0; sys_platform != 'linux'",
  "opencv-python-headless>=4.6.0; sys_platform == 'linux'",
  "pillow>=7.1.2",
  "polars",
  "psutil",
  "pyyaml>=5.3.1",
  "requests>=2.23.0",
  "scipy>=1.4.1",
  "torch>=1.8.0",
  "torchvision>=0.9.0",
  "ultralytics-thop>=2.0.18",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "services/sc-upstream",
  "libs/protos",
  "libs/ml",
  "libs/sampling-rules",
  "libs/klarf",
]

[tool.uv.sources]
finetune-api = { workspace = true }
ml-library = { workspace = true }
klarf = { workspace = true }

[dependency-groups]
dev = [
  "boto3>=1.43.9",
  "dspy>=3.3.0",
  "fastapi[all]>=0.135.2",
  "fiftyone>=1.20.1",
  "finetune-api",
  "grpcio-tools==1.80.0",
  "jupyter>=1.1.1",
  "mkdocs==1.6.1",
  "omegaconf>=2.3.0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-timeout>=2.4.0",
]

sc-runtime = [
  "finetune-api[sc-runtime]",
]

[tool.ty.src]
exclude = [
  "apps/api/app/shared/generated/**",
  "apps/api/tests/**",
  "apps/api/alembic/**",
]

[tool.pyright]
extraPaths = []

[tool.ruff]
exclude = [
  "apps/api/app/shared/generated/",
  "apps/api/tests/",
  "apps/api/alembic/",
  "libs/protos/src/proto_stubs/",
]

[tool.mypy]
disable_error_code = ["type-abstract"]


[tool.pytest.ini_options]
timeout = 180
