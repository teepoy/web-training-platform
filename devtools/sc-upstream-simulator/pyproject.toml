[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sc_upstream_simulator"

[project]
name = "sc-upstream-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "boto3==1.43.9",
    "fastapi==0.135.2",
    "greenlet==3.3.2",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.11",
    "sc-upstream",
    "sqlalchemy==2.0.48",
    "uvicorn==0.42.0",
]

[project.scripts]
sc-upstream-simulator = "sc_upstream_simulator.cli:main"

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
sc-upstream = { path = "../../services/sc-upstream" }
