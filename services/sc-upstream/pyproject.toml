[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sc_upstream"

[project]
name = "sc-upstream"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.80.0",
    "protobuf>=5.0",
    "proto-stubs",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.22",
    "polars>=1.0",
    "pyarrow>=14.0",
    "diskcache>=5.0",
    "redis>=7.0",
    "uvicorn==0.42.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "watchfiles>=1.2.0"]

[tool.uv.sources]
proto-stubs = { workspace = true }
