[project]
name = "sc-upstream"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.80.0",
    "protobuf>=5.0",
    "proto-stubs",
    "sqlalchemy>=2.0",
    "polars>=1.0",
    "pyarrow>=14.0",
    "diskcache>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.uv.sources]
proto-stubs = { path = "../../libs/protos" }

[tool.setuptools.packages.find]
where = ["src"]
