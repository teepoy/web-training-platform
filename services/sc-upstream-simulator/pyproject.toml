[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sc_upstream_simulator"

[project]
name = "sc-upstream-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18",
    "asyncpg>=0.31",
    "fastapi>=0.135",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "uvicorn>=0.41",
]

[project.scripts]
sc-upstream-simulator = "sc_upstream_simulator.cli:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.22",
    "pytest>=8.0",
    "pytest-asyncio>=1.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
