[environment]
python = ".venv"
python-version = "3.12"
extra-paths = ["./libs/protos"]

[analysis]
replace-imports-with-any = [
    "boto3",
    "boto3.**",
    "botocore",
    "botocore.**",
    "datasets",
    "datasets.**",
    "embedding_pb",
    "embedding_pb.**",
    "polars",
    "polars.**",
]

[src]
exclude = [
    "apps/api/alembic/versions/**",
    "apps/api/app/generated/**",
    "apps/api/tests/**",
    "examples/**",
    "libs/protos/**",
    "libs/seedmaker/**",
    "scripts/smoke_dev_batch.py",
    "scripts/smoke_dev_prediction.py",
    "scripts/smoke_dev_training.py",
]
