[environment]
python = ".venv"
python-version = "3.12"
extra-paths = ["./libs/protos"]

[analysis]
replace-imports-with-any = [
    "boto3",
    "boto3.**",
    "botocore",
    "botocore.**",
    "datasets",
    "datasets.**",
    "embedding_pb",
    "embedding_pb.**",
    "polars",
    "polars.**",
]

[src]
exclude = [
    "app/shared/generated/**",
    "app/main.py",
    "app/services/label_studio.py",
    "**/preview_upstream_s3.py",
    "app/agent/metadata_inference.py",
    "alembic/versions/**",
    "tests/**",
    "apps/api/app/shared/generated/**",
    "apps/api/app/main.py",
    "apps/api/app/services/label_studio.py",
    "apps/api/app/services/preview_upstream_s3.py",
    "apps/api/app/agent/metadata_inference.py",
    "apps/api/alembic/versions/**",
    "apps/api/app/shared/generated/**",
    "apps/api/tests/**",
    "examples/**",
    "libs/protos/**",
    "scripts/seedmaker/**",
    "scripts/smoke_dev_batch.py",
    "scripts/smoke_dev_prediction.py",
    "scripts/smoke_dev_training.py",
]
