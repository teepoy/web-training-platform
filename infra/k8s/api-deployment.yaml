apiVersion: apps/v1
kind: Deployment
metadata:
  name: finetune-api
  namespace: finetune
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finetune-api
  template:
    metadata:
      labels:
        app: finetune-api
    spec:
      serviceAccountName: finetune-api
      containers:
        - name: api
          image: finetune-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: finetune-config
            - secretRef:
                name: finetune-secrets
          env:
            - name: UVICORN_TIMEOUT_KEEP_ALIVE
              value: "120"
            - name: UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN
              value: "600"
            - name: UVICORN_TIMEOUT_WORKER_HEALTHCHECK
              value: "60"
          command:
            - sh
            - -lc
            - >-
              exec uv run --no-dev --frozen uvicorn app.main:app --host 0.0.0.0 --port 8000
              --timeout-keep-alive ${UVICORN_TIMEOUT_KEEP_ALIVE:-120}
              --timeout-graceful-shutdown ${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-600}
              --timeout-worker-healthcheck ${UVICORN_TIMEOUT_WORKER_HEALTHCHECK:-60}
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: finetune-api
  namespace: finetune
spec:
  selector:
    app: finetune-api
  ports:
    - port: 8000
      targetPort: 8000
