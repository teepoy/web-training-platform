# Prefect V2 CPU-only worker — orchestrates flow execution via Prefect queues.
# GPU workloads (train/predict/embed) are delegated to the gpu-worker HTTP API.
# This deployment MUST NOT request GPU resources or NVIDIA scheduling selectors.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-worker
  namespace: finetune
  labels:
    app: prefect-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-worker
  template:
    metadata:
      labels:
        app: prefect-worker
    spec:
      containers:
        - name: prefect-worker
          image: finetune-prefect-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "python", "-m", "app.flows.serve"]
          env:
            - name: WORKER_MODE
              value: "v2"
            - name: WORK_POOL_NAME
              value: "default-pool"
            - name: WORK_QUEUE_NAME
              value: "optimize-llm-cpu"
          envFrom:
            - configMapRef:
                name: finetune-config
            - secretRef:
                name: finetune-secrets
