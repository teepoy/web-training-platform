apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-parser
  namespace: finetune
  labels:
    app: image-parser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-parser
  template:
    metadata:
      labels:
        app: image-parser
    spec:
      containers:
        - name: image-parser
          image: ${IMAGE_PARSER_IMAGE}
          ports:
            - containerPort: 8090
              name: http
            - containerPort: 9092
              name: grpc
          env:
            - name: PORT
              value: "8090"
            - name: GRPC_PORT
              value: "9092"
            - name: CACHE_SIZE_MB
              value: "32768"
            - name: CACHE_DIR
              value: /tmp/image-parser-cache
            - name: CACHE_TTL
              value: 10m
            - name: CACHE_CLEANUP_INTERVAL
              value: 5m
            - name: CACHE_MAX_BYTES
              value: "34359738368"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: image-parser
  namespace: finetune
  labels:
    app: image-parser
spec:
  type: ClusterIP
  selector:
    app: image-parser
  ports:
    - name: http
      port: 8090
      targetPort: 8090
    - name: grpc
      port: 9092
      targetPort: 9092
