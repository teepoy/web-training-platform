apiVersion: apps/v1
kind: Deployment
metadata:
  name: finetune-perspective-ws
  namespace: finetune
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finetune-perspective-ws
  template:
    metadata:
      labels:
        app: finetune-perspective-ws
    spec:
      serviceAccountName: finetune-api
      containers:
        - name: perspective-ws
          image: finetune-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: websocket-1
            - containerPort: 8002
              name: websocket-2
            - containerPort: 8003
              name: websocket-3
            - containerPort: 8004
              name: websocket-4
          envFrom:
            - configMapRef:
                name: finetune-config
            - secretRef:
                name: finetune-secrets
          command:
            - /usr/bin/supervisord
            - -c
            - /app/apps/api/supervisord.perspective.conf
          readinessProbe:
            exec:
              command:
                - python
                - /app/apps/api/scripts/perspective_healthcheck.py
                - --url
                - http://localhost:8001/ready
                - --url
                - http://localhost:8002/ready
                - --url
                - http://localhost:8003/ready
                - --url
                - http://localhost:8004/ready
                - --timeout-seconds
                - "2"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - /app/apps/api/scripts/perspective_healthcheck.py
                - --url
                - http://localhost:8001/health
                - --url
                - http://localhost:8002/health
                - --url
                - http://localhost:8003/health
                - --url
                - http://localhost:8004/health
                - --timeout-seconds
                - "2"
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: finetune-perspective-ws
  namespace: finetune
spec:
  selector:
    app: finetune-perspective-ws
  ports:
    - port: 8001
      targetPort: 8001
      name: websocket-1
    - port: 8002
      targetPort: 8002
      name: websocket-2
    - port: 8003
      targetPort: 8003
      name: websocket-3
    - port: 8004
      targetPort: 8004
      name: websocket-4
