# Prefect CPU worker — executes flows from the default-cpu pool.
# GPU workloads are handled by the separate prefect-worker-gpu deployment.
# This deployment MUST NOT request GPU resources or NVIDIA scheduling selectors.
#
# PREFECT_API_URL is sourced from finetune-config ConfigMap (runtime-configurable).
# The worker command is explicit here; the Dockerfile ENTRYPOINT is for Compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-worker-cpu
  namespace: finetune
  labels:
    app: prefect-worker-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-worker-cpu
  template:
    metadata:
      labels:
        app: prefect-worker-cpu
    spec:
      containers:
        - name: prefect-worker-cpu
          image: finetune-prefect-worker-cpu:latest
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - --directory
            - apps/api
            - prefect
            - worker
            - start
            - --pool
            - default-cpu
          envFrom:
            - configMapRef:
                name: finetune-config
            - secretRef:
                name: finetune-secrets
