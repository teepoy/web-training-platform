apiVersion: v1
kind: ConfigMap
metadata:
  name: finetune-config
  namespace: finetune
data:
  APP_CONFIG_PROFILE: "dev"
  FRONTEND_URL: "http://localhost:5173"
  MNT: "/mnt/data"
  PREFECT_API_URL: "http://prefect-server.finetune.svc.cluster.local:4200/api"
  PREFECT_UI_URL: "http://localhost:4200"
  EMBEDDING_GRPC_TARGET: "embedding.finetune.svc.cluster.local:50051"
  GPU_WORKER_BASE_URL: "http://gpu-worker.finetune.svc.cluster.local:8010"
  LLM_BASE_URL: "http://ollama.finetune.svc.cluster.local:11434/v1"
  LABEL_STUDIO_URL: "http://label-studio.finetune.svc.cluster.local:8080"
  LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
  REDIS_HOST: "redis.finetune.svc.cluster.local"
  REDIS_URL: "redis://redis.finetune.svc.cluster.local:6379/0"
  SC_UPSTREAM_ADDR: "sc-upstream.finetune.svc.cluster.local:9091"
  SC_UPSTREAM_FLIGHT_ADDR: "grpc://sc-upstream.finetune.svc.cluster.local:9093"
  IMAGE_PARSER_GRPC_ADDR: "image-parser.finetune.svc.cluster.local:9092"
  MINIO_ENDPOINT: "minio.finetune.svc.cluster.local:9000"
  MINIO_REGION: "us-east-1"
  SC_DATA_PROVIDER_CACHE_DIR: "/var/cache/sc-data-provider"
  SC_DATA_PROVIDER_CACHE_NAMESPACE: "sc-data-provider"
