apiVersion: apps/v1
kind: Deployment
metadata:
  name: sc-upstream
  namespace: finetune
  labels:
    app: sc-upstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sc-upstream
  template:
    metadata:
      labels:
        app: sc-upstream
    spec:
      containers:
        - name: sc-upstream
          image: ${SC_UPSTREAM_IMAGE}
          ports:
            - containerPort: 8091
              name: http
            - containerPort: 9091
              name: grpc
            - containerPort: 9093
              name: flight
          env:
            - name: HEALTH_PORT
              value: "8091"
            - name: GRPC_PORT
              value: "9091"
            - name: FLIGHT_PORT
              value: "9093"
            - name: UPSTREAM_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: finetune-config
                  key: sc_upstream_db_url
            - name: ZIPS_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: finetune-config
                  key: sc_upstream_zips_db_url
            - name: CACHE_DIR
              value: /data/cache
            - name: SC_UPSTREAM_CACHE_SIZE_LIMIT_BYTES
              valueFrom:
                configMapKeyRef:
                  name: finetune-config
                  key: sc_upstream_cache_size_limit_bytes
                  optional: true
            - name: SC_UPSTREAM_RAW_CACHE_CLEANUP_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: finetune-config
                  key: sc_upstream_raw_cache_cleanup_interval_seconds
                  optional: true
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: finetune-config
                  key: REDIS_URL
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sc-upstream
  namespace: finetune
  labels:
    app: sc-upstream
spec:
  type: ClusterIP
  selector:
    app: sc-upstream
  ports:
    - name: http
      port: 8091
      targetPort: 8091
    - name: grpc
      port: 9091
      targetPort: 9091
    - name: flight
      port: 9093
      targetPort: 9093
