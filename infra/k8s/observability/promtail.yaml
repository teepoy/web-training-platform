# Promtail — log collector DaemonSet.
# Ships container logs from every node to Loki.
# Requires hostPath mounts for /var/log/pods and /var/lib/docker/containers.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: finetune
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: finetune
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: finetune
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.finetune.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod

        # ── Relabeling ──────────────────────────────────────────────────────
        # Low-cardinality labels only: namespace, pod, container, service, env.
        # Pod UIDs, controller names, and ALL pod labels are dropped to prevent
        # Loki label-set explosion. High-cardinality values (job ids, run ids)
        # stay in log content — query with  {service="..."} |= "job_id=<value>".
        relabel_configs:
          # Required: set log file path from pod UID + container name.
          - action: replace
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__

          # Keep namespace (low cardinality — typically one value per cluster).
          - action: replace
            source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          # Keep pod name (needed to correlate logs ↔ pod events).
          - action: replace
            source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          # Keep container name.
          - action: replace
            source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

          # Derive `service` from the container name (same approach as Compose).
          # Container names in finetune K8s: finetune-api, gpu-worker, prefect-worker.
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: '(?:finetune[-_])?(.+?)(?:[-_]\d+)?$'
            target_label: service
            replacement: '${1}'

          # Drop all other __meta_kubernetes_* labels — prevents pod labels,
          # UIDs, controller names, and annotations from becoming Loki stream labels.
          - action: labeldrop
            regex: '__meta_kubernetes_.*'

        # ── Pipeline stages ─────────────────────────────────────────────────
        pipeline_stages:
          # Static env label — low cardinality, useful for multi-env queries.
          - static_labels:
              env: finetune

          # Parse JSON so structured fields (platform_job_id, gpu_job_id, etc.)
          # are accessible via Loki's |= / | json filters without becoming labels.
          - json:
              expressions:
                level: level
                logger: logger

          # Promote `level` to a Loki label (low cardinality: info/warn/error/debug).
          - labels:
              level:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: finetune
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.3.0
          args:
            - '-config.file=/etc/promtail/promtail-config.yaml'
          ports:
            - containerPort: 9080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: pods
          hostPath:
            path: /var/log/pods
