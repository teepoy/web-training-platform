apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: finetune
data:
  alert-rules.yml: |
    groups:
      - name: finetune
        rules:
          - alert: GPUWorkerDown
            expr: up{job="gpu-worker"} == 0
            for: 2m
            labels:
              severity: critical
              group: finetune
            annotations:
              summary: "GPU worker is down"
              description: "Prometheus cannot reach the gpu-worker scrape target for more than 2 minutes."

          - alert: PrefectExporterDown
            expr: up{job="prefect-exporter"} == 0
            for: 2m
            labels:
              severity: warning
              group: finetune
            annotations:
              summary: "Prefect exporter is down"
              description: "The prefect-exporter scrape target has been unreachable for more than 2 minutes."

          - alert: QueueBacklogHigh
            expr: prefect_work_queue_depth > 100
            for: 5m
            labels:
              severity: warning
              group: finetune
            annotations:
              summary: "Prefect work queue backlog is high"
              description: "prefect_work_queue_depth has exceeded 100 for more than 5 minutes (current: {{ $value }})."

          - alert: GPUWorkerOOM
            expr: rate(container_restarts_total{container="gpu-worker",namespace="finetune"}[15m]) * 900 > 3
            for: 1m
            labels:
              severity: critical
              group: finetune
            annotations:
              summary: "GPU worker is restart-looping (possible OOM)"
              description: "GPU worker container has restarted more than 3 times in the last 15 minutes."

          - alert: DcgmGpuMemoryHigh
            expr: (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.9) or vector(0)
            for: 5m
            labels:
              severity: warning
              group: finetune
            annotations:
              summary: "GPU framebuffer memory utilisation is above 90%"
              description: "GPU framebuffer usage exceeds 90% for more than 5 minutes (current: {{ $value | humanizePercentage }})."

          - alert: ServiceRestartLoop
            expr: rate(container_restarts_total{container=~"api|gpu-worker|prefect-worker",namespace="finetune"}[10m]) * 600 > 5
            for: 1m
            labels:
              severity: critical
              group: finetune
            annotations:
              summary: "Platform service is in a restart loop"
              description: "Container {{ $labels.container }} has restarted more than 5 times in the last 10 minutes."
