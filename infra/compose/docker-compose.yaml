services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: finetune
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres && psql -U postgres -d prefect -c 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3.6.25-python3.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/prefect
    ports:
      - "4200:4200"
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  label-studio:
    image: heartexlabs/label-studio:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: labelstudio
      POSTGRE_USER: postgres
      POSTGRE_PASSWORD: postgres
      POSTGRE_HOST: postgres
      POSTGRE_PORT: "5432"
      LABEL_STUDIO_USERNAME: admin@example.com
      LABEL_STUDIO_PASSWORD: admin123
      LABEL_STUDIO_USER_TOKEN: "ls-smoke-token-for-local-dev"
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
    ports:
      - "8080:8080"
    volumes:
      - ls-data:/label-studio/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  image-parser:
    build:
      context: ../..
      dockerfile: services/image-parser/Dockerfile
    depends_on:
      - sc-upstream
    environment:
      - PORT=8090
      - GRPC_PORT=9092
      - CACHE_SIZE_MB=${IMAGE_PARSER_CACHE_SIZE_MB:-1024}
      - S3_MAX_CONNS=1000
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_ZIPS_ACCESS_KEY=${S3_ZIPS_ACCESS_KEY:-${S3_ACCESS_KEY:-minioadmin}}
      - S3_ZIPS_SECRET_KEY=${S3_ZIPS_SECRET_KEY:-${S3_SECRET_KEY:-minioadmin}}
      - S3_REVIEW_ACCESS_KEY=${S3_REVIEW_ACCESS_KEY:-${S3_ACCESS_KEY:-minioadmin}}
      - S3_REVIEW_SECRET_KEY=${S3_REVIEW_SECRET_KEY:-${S3_SECRET_KEY:-minioadmin}}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_PATH_STYLE=true
      - SC_UPSTREAM_ADDR=sc-upstream:9091
    ports:
      - "8090:8090"
      - "9092:9092"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  sc-upstream:
    build:
      context: ../..
      dockerfile: services/sc-upstream/Dockerfile
    environment:
      - GRPC_PORT=9091
      - FLIGHT_PORT=9093
      - UPSTREAM_DB_URL=sqlite:////data/wafer_inspection.db
      - ZIPS_DB_URL=sqlite:////data/inspection_zips.db
      - CACHE_DIR=/data/cache
    expose:
      - "9091"
      - "9093"
    volumes:
      - ./data:/data

volumes:
  pgdata:
  minio-data:
  ls-data:
