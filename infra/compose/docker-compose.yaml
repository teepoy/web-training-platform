services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: finetune
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d prefect -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3.6.25-python3.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/prefect
    ports:
      - "4200:4200"
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  embedding:
    build:
      context: ../..
      dockerfile: apps/embedding/Dockerfile
    ports:
      - "50051:50051"
    environment:
      GRPC_PORT: "50051"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import grpc; ch=grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding:
        condition: service_healthy
      gpu-worker:
        condition: service_healthy
      label-studio:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    environment:
      APP_CONFIG_PROFILE: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_URL: http://localhost:4200
      EMBEDDING_GRPC_TARGET: embedding:50051
      GPU_WORKER_BASE_URL: http://gpu-worker:8010
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
      LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
      LABEL_STUDIO_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/labelstudio"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen-max}
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/api:/app/apps/api
    command:
      [
        "/bin/sh",
        "-lc",
        "cd /app/apps/api && /app/.venv/bin/alembic upgrade head && /app/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prefect-worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      prefect-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_CONFIG_PROFILE: dev
      PREFECT_API_URL: http://prefect-server:4200/api
      PLATFORM_API_URL: http://api:8000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      EMBEDDING_GRPC_TARGET: embedding:50051
      GPU_WORKER_BASE_URL: http://gpu-worker:8010
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
      LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
      LABEL_STUDIO_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/labelstudio"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen-max}
      WORKER_MODE: v2
      WORK_POOL_NAME: default-pool
      WORK_QUEUE_NAME: optimize-llm-cpu
    command: ["/app/.venv/bin/python", "-m", "app.flows.serve"]
    restart: on-failure

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: on-failure

  gpu-worker:
    build:
      context: ../..
      dockerfile: apps/inference/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding:
        condition: service_healthy
    environment:
      APP_CONFIG_PROFILE: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      EMBEDDING_GRPC_TARGET: embedding:50051
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-local-dev-token}
      LLM_MODEL: ${LLM_MODEL:-llava}
      TRAINING_TIMEOUT_SECONDS: "7200"
    ports:
      - "8010:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  label-studio:
    image: heartexlabs/label-studio:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: labelstudio
      POSTGRE_USER: postgres
      POSTGRE_PASSWORD: postgres
      POSTGRE_HOST: postgres
      POSTGRE_PORT: "5432"
      LABEL_STUDIO_USERNAME: admin@example.com
      LABEL_STUDIO_PASSWORD: admin123
      LABEL_STUDIO_USER_TOKEN: "ls-smoke-token-for-local-dev"
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
    ports:
      - "8080:8080"
    volumes:
      - ls-data:/label-studio/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin-pgpass:/pgpass:ro
    restart: on-failure

  # ═══════════════════════════════════════════════════════════════════
  # Observability Stack — --profile observability
  # ═══════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v3.3.0
    profiles: ["observability"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.4.0
    profiles: ["observability"]
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.0
    profiles: ["observability"]
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - loki

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["observability"]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    profiles: ["observability"]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--port=8080'
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: ["observability"]
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  prefect-exporter:
    image: prefecthq/prefect:3.6.25-python3.12
    profiles: ["observability"]
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      EXPORTER_PORT: "8000"
    command:
      - python
      - /exporter/exporter.py
    volumes:
      - ./observability/prefect-exporter/exporter.py:/exporter/exporter.py:ro
    restart: unless-stopped
    depends_on:
      - prefect-server

  # ═══════════════════════════════════════════════════════════════════
  # GPU Monitoring — --profile gpu  (Linux + NVIDIA only)
  # ═══════════════════════════════════════════════════════════════════
  dcgm-exporter:
    image: nvidia/dcgm-exporter:3.4.1-3.6.2-ubuntu22.04
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  minio-data:
  ls-data:
  pgadmin-data:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:
