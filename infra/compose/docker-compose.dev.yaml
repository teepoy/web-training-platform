# ─────────────────────────────────────────────────────────────────────
# Dev override compose file
# Usage: docker compose -f infra/compose/docker-compose.yaml -f infra/compose/docker-compose.dev.yaml up -d
# With profiles:
#   --profile observability  → start observability stack
#   --profile gpu            → start GPU worker + dcgm-exporter (Linux/NVIDIA only)
#
# CRITICAL: Compose override files REPLACE list fields entirely.
# Every service fully redeclares ALL list fields:
#   volumes, command, environment, depends_on, healthcheck,
#   restart, ports, profiles, devices, privileged, deploy
# ─────────────────────────────────────────────────────────────────────

x-platform-environment: &platform-environment
  PYTHONPATH: /app/libs/protos/src
  APP_CONFIG_PROFILE: dev
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
  PREFECT_API_URL: http://prefect-server:4200/api
  PREFECT_UI_URL: http://localhost:4200
  LABEL_STUDIO_URL: "http://label-studio:8080"
  LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
  LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
  LABEL_STUDIO_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/labelstudio"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: finetune-artifacts
  SC_PATCH_S3_ENDPOINT: minio:9000
  SC_PATCH_S3_ACCESS_KEY: minioadmin
  SC_PATCH_S3_SECRET_KEY: minioadmin
  SC_PATCH_S3_BUCKET: sc-patch-images
  SC_REVIEW_S3_ENDPOINT: minio:9000
  SC_REVIEW_S3_ACCESS_KEY: minioadmin
  SC_REVIEW_S3_SECRET_KEY: minioadmin
  SC_REVIEW_S3_BUCKET: sc-review-images
  SC_UPSTREAM_ADDR: sc-upstream:9091
  SC_UPSTREAM_FLIGHT_ADDR: grpc://sc-upstream:9093
  IMAGE_PARSER_GRPC_ADDR: image-parser:9092
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-qwen/qwen-max}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PERSPECTIVE_WS_MALLOC_CONF: ${PERSPECTIVE_WS_MALLOC_CONF:-background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000,retain:false}

x-api-runtime: &api-runtime
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
    target: dev
    args:
      UV_INDEX_URL: ${UV_INDEX_URL:-}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-}
  volumes:
    - ../../apps/api:/app/apps/api
    - ../../libs/protos:/app/libs/protos
  environment:
    <<: *platform-environment
    UVICORN_TIMEOUT_KEEP_ALIVE: "120"
    UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: "600"
    UVICORN_TIMEOUT_WORKER_HEALTHCHECK: "60"
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    label-studio:
      condition: service_healthy
    prefect-server:
      condition: service_healthy
    redis:
      condition: service_started
    sc-upstream:
      condition: service_healthy
    image-parser:
      condition: service_healthy
  restart: on-failure

services:
  # ───────────────────────────────────────────────────────────────────
  # API — dev mode with bind mounts, hot reload, alembic auto‑migration
  # ───────────────────────────────────────────────────────────────────
  api:
    <<: *api-runtime
    command:
      [
        "/bin/sh",
        "-lc",
        "cd /app/apps/api && ( uv run --no-dev --frozen alembic upgrade head || echo '[WARN] alembic upgrade skipped (migrations may be missing)' ) && uv run --no-dev --frozen uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/apps/api --reload-dir /app/libs/protos --timeout-keep-alive $${UVICORN_TIMEOUT_KEEP_ALIVE:-120} --timeout-graceful-shutdown $${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-600} --timeout-worker-healthcheck $${UVICORN_TIMEOUT_WORKER_HEALTHCHECK:-60}",
      ]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s

  perspective-ws:
    <<: *api-runtime
    command:
      [
        "python",
        "/app/apps/api/scripts/perspective_container_watchdog.py",
        "--",
        "/bin/sh",
        "-lc",
        'cd /app/apps/api && export MALLOC_CONF="$${PERSPECTIVE_WS_MALLOC_CONF}" && exec /app/.venv/bin/uvicorn app.perspective_main:app --host 0.0.0.0 --port 8001 --timeout-keep-alive $${UVICORN_TIMEOUT_KEEP_ALIVE:-120} --timeout-graceful-shutdown $${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-600} --timeout-worker-healthcheck $${UVICORN_TIMEOUT_WORKER_HEALTHCHECK:-60}',
      ]
    mem_limit: ${PERSPECTIVE_WS_MEMORY:-4g}
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/app/apps/api/scripts/perspective_healthcheck.py",
          "--url",
          "http://localhost:8001/ready",
          "--timeout-seconds",
          "2",
          "--failure-threshold",
          "3",
          "--startup-grace-seconds",
          "60",
          "--force-container-restart",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  # ───────────────────────────────────────────────────────────────────
  # Web — Vite dev server with bind mount + hot module replacement
  # ───────────────────────────────────────────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: dev
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    volumes:
      - ../../apps/web:/app/apps/web
      - ../../packages/sc-map-element:/app/packages/sc-map-element
    environment:
      VITE_PROXY_TARGET: "http://api:8000"
      VITE_PERSPECTIVE_WS_TARGET: "http://perspective-ws:8001"
      VITE_API_BASE_URL: "http://api:8000"
      VITE_IMAGE_PARSER_TARGET: "http://image-parser:8090"
    command: sh -lc "rm -rf node_modules/.vite && pnpm dev --host 0.0.0.0 --port 5173 --force"
    depends_on:
      - api
      - perspective-ws
    ports:
      - "5173:5173"
    restart: on-failure

  # ───────────────────────────────────────────────────────────────────
  # image-parser — Go hot reload with bind-mounted service sources
  # ───────────────────────────────────────────────────────────────────
  image-parser:
    build:
      context: ../..
      dockerfile: services/image-parser/Dockerfile
      target: dev
    volumes:
      - ../../services/image-parser:/app/services/image-parser
    environment:
      PORT: "8090"
      GRPC_PORT: "9092"
      CACHE_SIZE_MB: "1024"
      CACHE_DIR: /tmp/image-parser-cache
      CACHE_TTL: 10m
      CACHE_CLEANUP_INTERVAL: 5m
      CACHE_MAX_BYTES: "1073741824"
      S3_MAX_CONNS: "1000"
      SC_UPSTREAM_ADDR: sc-upstream:9091
    depends_on:
      sc-upstream:
        condition: service_healthy
    ports:
      - "8090:8090"
      - "9092:9092"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s
    restart: on-failure

  # ───────────────────────────────────────────────────────────────────
  # sc-upstream — Python hot reload with bind-mounted service + proto stubs
  # ───────────────────────────────────────────────────────────────────
  sc-upstream:
    build:
      context: ../..
      dockerfile: services/sc-upstream/Dockerfile
    volumes:
      - ../../services/sc-upstream:/app/services/sc-upstream
      - ../../libs/protos:/app/libs/protos
      - ./data:/data
    command:
      [
        "/bin/sh",
        "-lc",
        "cd /app/services/sc-upstream && uv sync --frozen --package sc-upstream && exec /app/.venv/bin/python -m watchfiles --filter python --target-type command '/app/.venv/bin/python -m sc_upstream.server' /app/services/sc-upstream/src /app/libs/protos/src",
      ]
    environment:
      PYTHONPATH: /app/libs/protos/src
      GRPC_PORT: "9091"
      FLIGHT_PORT: "9093"
      CACHE_DIR: /data/cache
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    expose:
      - "9091"
      - "9093"
    ports:
      - "9091:9091"
      - "9093:9093"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 9091), timeout=20); s.close()",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s
    restart: on-failure

  # ───────────────────────────────────────────────────────────────────
  # Prefect CPU worker — bind-mounted sources for fast iteration
  # ───────────────────────────────────────────────────────────────────
  prefect-worker-cpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-cpu
      target: dev
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../libs/protos:/app/libs/protos
      - ../../apps/api/app/modules/types/ml:/app/apps/api/app/modules/types/ml
    environment:
      <<: *platform-environment
      PYTHONPATH: /app/libs/protos/src
    depends_on:
      prefect-server:
        condition: service_healthy
      image-parser:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────
  # Prefect GPU worker — profile-gated (Linux/NVIDIA only)
  # ───────────────────────────────────────────────────────────────────
  prefect-worker-gpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-gpu
      target: dev
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../libs/protos:/app/libs/protos
      - ../../apps/api/app/modules/types/ml:/app/apps/api/app/modules/types/ml
    environment:
      <<: *platform-environment
      PYTHONPATH: /app/libs/protos/src
    depends_on:
      prefect-server:
        condition: service_healthy
      image-parser:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────
  # Deployments bootstrap — creates work pools, registers flows
  # ───────────────────────────────────────────────────────────────────
  deployments-bootstrap:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-cpu
      target: dev
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    entrypoint: [""]
    command: >
      sh -c "
        uv run --no-dev --frozen --directory apps/api prefect work-pool create default-cpu --type process || true;
        uv run --no-dev --frozen --directory apps/api prefect work-pool create default-gpu --type process || true;
        uv run --no-dev --frozen --directory apps/api ftapi deployments apply
      "
    environment:
      <<: *platform-environment
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: "no"

  # ───────────────────────────────────────────────────────────────────
  # pgAdmin — PostgreSQL web admin UI
  # ───────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:9.16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin-pgpass:/pgpass:ro
    restart: on-failure

# ─────────────────────────────────────────────────────────────────────
# Named volumes (dev‑only — base volumes are in docker-compose.yaml)
# ─────────────────────────────────────────────────────────────────────
volumes:
  pgadmin-data:
