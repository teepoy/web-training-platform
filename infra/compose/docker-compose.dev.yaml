# ─────────────────────────────────────────────────────────────────────
# Dev override compose file
# Usage: docker compose -f infra/compose/docker-compose.yaml -f infra/compose/docker-compose.dev.yaml up -d
# With profiles:
#   --profile observability  → start observability stack
#   --profile gpu            → start GPU worker + dcgm-exporter (Linux/NVIDIA only)
#
# CRITICAL: Compose override files REPLACE list fields entirely.
# Every service fully redeclares ALL list fields:
#   volumes, command, environment, depends_on, healthcheck,
#   restart, ports, profiles, devices, privileged, deploy
# ─────────────────────────────────────────────────────────────────────

services:
  # ───────────────────────────────────────────────────────────────────
  # API — dev mode with bind mounts, hot reload, alembic auto‑migration
  # ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: dev
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../libs/platform-runtime:/app/libs/platform-runtime
      - ../../libs/protos:/app/libs/protos
    command:
      [
        "/bin/sh",
        "-lc",
        "cd /app/apps/api && ( uv run --no-dev alembic upgrade head || echo '[WARN] alembic upgrade skipped (migrations may be missing)' ) && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/apps/api --reload-dir /app/libs/platform-runtime --reload-dir /app/libs/protos",
      ]
    environment:
      PYTHONPATH: /app/libs/protos/src:/app/libs/platform-runtime/src
      APP_CONFIG_PROFILE: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_URL: http://localhost:4200
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
      LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
      LABEL_STUDIO_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/labelstudio"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen-max}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      label-studio:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      redis:
        condition: service_started
      sc-upstream:
        condition: service_healthy
      image-parser:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: on-failure

  # ───────────────────────────────────────────────────────────────────
  # Web — Vite dev server with bind mount + hot module replacement
  # ───────────────────────────────────────────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: dev
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    volumes:
      - ../../apps/web:/app/apps/web
    environment:
      VITE_PROXY_TARGET: "http://api:8000"
      VITE_API_BASE_URL: "http://api:8000"
      VITE_IMAGE_PARSER_TARGET: "http://image-parser:8090"
    command: sh -lc "rm -rf node_modules/.vite && pnpm dev --host 0.0.0.0 --port 5173 --force"
    depends_on:
      - api
    ports:
      - "5173:5173"
    restart: on-failure

  # ───────────────────────────────────────────────────────────────────
  # image-parser — Go hot reload with bind-mounted service sources
  # ───────────────────────────────────────────────────────────────────
  image-parser:
    build:
      context: ../..
      dockerfile: services/image-parser/Dockerfile
      target: dev
    volumes:
      - ../../services/image-parser:/app/services/image-parser
    environment:
      PORT: "8090"
      GRPC_PORT: "9092"
      CACHE_SIZE_MB: "1024"
      S3_MAX_CONNS: "1000"
      SC_UPSTREAM_ADDR: sc-upstream:9091
    depends_on:
      sc-upstream:
        condition: service_healthy
    ports:
      - "8090:8090"
      - "9092:9092"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: on-failure

  # ───────────────────────────────────────────────────────────────────
  # sc-upstream — Python hot reload with bind-mounted service + proto stubs
  # ───────────────────────────────────────────────────────────────────
  sc-upstream:
    build:
      context: ../..
      dockerfile: services/sc-upstream/Dockerfile
    volumes:
      - ../../services/sc-upstream:/app/services/sc-upstream
      - ../../libs/protos:/app/libs/protos
      - ./data:/data
    command:
      [
        "/bin/sh",
        "-lc",
        "cd /app/services/sc-upstream && uv sync --frozen && uv run watchfiles --filter python 'uv run python -m sc_upstream.server' src /app/libs/protos/src",
      ]
    environment:
      PYTHONPATH: /app/libs/protos/src
      GRPC_PORT: "9091"
      FLIGHT_PORT: "9093"
      CACHE_DIR: /data/cache
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    expose:
      - "9091"
      - "9093"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 9091), timeout=2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: on-failure

  # ───────────────────────────────────────────────────────────────────
  # Prefect CPU worker — bind-mounted sources for fast iteration
  # ───────────────────────────────────────────────────────────────────
  prefect-worker-cpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-cpu
      target: dev
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../libs/platform-runtime:/app/libs/platform-runtime
      - ../../libs/protos:/app/libs/protos
      - ../../libs/ml:/app/libs/ml
    environment:
      PYTHONPATH: /app/libs/protos/src:/app/libs/platform-runtime/src:/app/libs/ml/src
      PREFECT_API_URL: http://prefect-server:4200/api
      APP_CONFIG_PROFILE: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
      LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
      IMAGE_PARSER_GRPC_ADDR: image-parser:9092
    depends_on:
      prefect-server:
        condition: service_healthy
      image-parser:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────
  # Prefect GPU worker — profile-gated (Linux/NVIDIA only)
  # ───────────────────────────────────────────────────────────────────
  prefect-worker-gpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-gpu
      target: dev
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../libs/platform-runtime:/app/libs/platform-runtime
      - ../../libs/protos:/app/libs/protos
      - ../../libs/ml:/app/libs/ml
    environment:
      PYTHONPATH: /app/libs/protos/src:/app/libs/platform-runtime/src:/app/libs/ml/src
      PREFECT_API_URL: http://prefect-server:4200/api
      APP_CONFIG_PROFILE: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
      LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
      IMAGE_PARSER_GRPC_ADDR: image-parser:9092
    depends_on:
      prefect-server:
        condition: service_healthy
      image-parser:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────
  # Deployments bootstrap — creates work pools, registers flows
  # ───────────────────────────────────────────────────────────────────
  deployments-bootstrap:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-cpu
      target: dev
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    entrypoint: [""]
    command: >
      sh -c "
        uv run --no-dev --directory apps/api prefect work-pool create default-cpu --type process || true;
        uv run --no-dev --directory apps/api prefect work-pool create default-gpu --type process || true;
        uv run --no-dev --directory apps/api ftapi deployments apply
      "
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      prefect-server:
        condition: service_healthy
    restart: "no"

  # ───────────────────────────────────────────────────────────────────
  # pgAdmin — PostgreSQL web admin UI
  # ───────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:9.16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin-pgpass:/pgpass:ro
    restart: on-failure

# ─────────────────────────────────────────────────────────────────────
# Named volumes (dev‑only — base volumes are in docker-compose.yaml)
# ─────────────────────────────────────────────────────────────────────
volumes:
  pgadmin-data:
