# ─────────────────────────────────────────────────────────────────────
# Source-mounted development overlay for docker-compose.yaml.
# Usage: docker compose -f infra/compose/docker-compose.yaml -f infra/compose/docker-compose.dev.yaml up -d
# With profiles:
#   --profile observability  → start observability stack
#   --profile gpu            → start GPU worker + dcgm-exporter (Linux/NVIDIA only)
#
# This file owns all local application/runtime services. Services in
# docker-compose.yaml are infrastructure dependencies only.
# ─────────────────────────────────────────────────────────────────────

x-platform-environment: &platform-environment
  PYTHONPATH: /app/libs/protos/src
  APP_CONFIG_PROFILE: dev
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
  PREFECT_API_URL: http://prefect-server:4200/api
  PREFECT_UI_URL: http://localhost:4200
  LABEL_STUDIO_URL: "http://label-studio:8080"
  LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
  LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
  LABEL_STUDIO_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/labelstudio"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: finetune-artifacts
  SC_PATCH_S3_ENDPOINT: minio:9000
  SC_PATCH_S3_ACCESS_KEY: minioadmin
  SC_PATCH_S3_SECRET_KEY: minioadmin
  SC_PATCH_S3_BUCKET: sc-patch-images
  SC_REVIEW_S3_ENDPOINT: minio:9000
  SC_REVIEW_S3_ACCESS_KEY: minioadmin
  SC_REVIEW_S3_SECRET_KEY: minioadmin
  SC_REVIEW_S3_BUCKET: sc-review-images
  SC_UPSTREAM_ADDR: sc-upstream:9091
  SC_UPSTREAM_FLIGHT_ADDR: grpc://sc-upstream:9093
  SC_UPSTREAM_IMAGE_SOURCE_FORMAT: sc.legacy-range-zip.v1
  IMAGE_PARSER_GRPC_ADDR: image-parser:9092
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-qwen/qwen-max}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SC_DATA_PROVIDER_IMPLEMENTATION: duckdb
  SC_DATA_PROVIDER_MAX_RSS_MB: "1536"
  SC_DATA_PROVIDER_CACHE_DIR: /var/cache/sc-data-provider
  SC_DATA_PROVIDER_CACHE_NAMESPACE: sc-data-provider
  SC_DATA_PROVIDER_REVISION_NAMESPACE: sc-data-provider
  SC_DATA_PROVIDER_DUCKDB_MEMORY_LIMIT: 1GiB
  SC_DATA_PROVIDER_DUCKDB_THREADS: "1"
  SC_DATA_PROVIDER_DUCKDB_TEMP_DIRECTORY_SIZE: 2GiB
  SC_DATA_PROVIDER_DUCKDB_ALLOCATOR_BACKGROUND_THREADS: "true"
  SC_DATA_PROVIDER_DUCKDB_PRESERVE_INSERTION_ORDER: "false"
  SC_DATA_PROVIDER_DUCKDB_ALLOCATOR_FLUSH_THRESHOLD: 64MiB
  SC_DATA_PROVIDER_DUCKDB_ALLOCATOR_BULK_DEALLOCATION_FLUSH_THRESHOLD: 128MiB
  SC_DATA_PROVIDER_CONNECTION_RECYCLE_RSS_MB: "1280"
  SC_DATA_PROVIDER_WORKER_COUNT: ${SC_DATA_PROVIDER_DEV_WORKERS:-1}
  SC_DATA_PROVIDER_CONTAINER_MEMORY_LIMIT_MB: ${SC_DATA_PROVIDER_CONTAINER_MEMORY_LIMIT_MB:-6144}
  SC_DATA_PROVIDER_PYTHON_OVERHEAD_MB: "256"
  SC_DATA_PROVIDER_SERVICE_HEADROOM_MB: "512"
  SC_DATA_PROVIDER_OBJECT_CACHE_MAX_BYTES: "10737418240"
  SC_DATA_PROVIDER_OBJECT_CACHE_LOW_WATERMARK_BYTES: "8589934592"
  SC_DATA_PROVIDER_OBJECT_IDLE_TTL_SECONDS: "3600"
  SC_DATA_PROVIDER_CLEANUP_INTERVAL_SECONDS: "60"
  SC_DATA_PROVIDER_STALE_WRITE_SECONDS: "300"
  SC_DATA_PROVIDER_LEASE_TTL_SECONDS: "60"
  SC_DATA_PROVIDER_LEASE_HEARTBEAT_SECONDS: "20"
  SC_DATA_PROVIDER_BUILD_LOCK_TTL_SECONDS: "60"
  SC_DATA_PROVIDER_BUILD_LOCK_HEARTBEAT_SECONDS: "20"
  SC_DATA_PROVIDER_BUILD_WAIT_TIMEOUT_SECONDS: "30"
  SC_DATA_PROVIDER_BUILD_POLL_INTERVAL_MS: "100"
  SC_DATA_PROVIDER_SQL_TIMEOUT_SECONDS: "30"
  SC_DATA_PROVIDER_MAX_RESPONSE_BYTES: "268435456"
  SC_DATA_PROVIDER_ARROW_BATCH_ROWS: "16384"
  SC_DATA_PROVIDER_STREAM_QUEUE_CAPACITY: "8"
  SC_DATA_PROVIDER_STREAM_QUEUE_POLL_INTERVAL_MS: "100"
  SC_DATA_PROVIDER_SSE_HEARTBEAT_SECONDS: "15"
  SC_DATA_PROVIDER_SSE_MAX_CONNECTION_SECONDS: "60"
  SC_PIPELINE_IMPORT_BATCH_ROWS: "25000"
  SC_PIPELINE_INDEX_ROW_GROUP_ROWS: "65536"
  SC_PIPELINE_MATERIALIZATION_BATCH_ROWS: "512"
  SC_PIPELINE_MATERIALIZATION_MAX_ERROR_RECORDS: "1000"
  SC_PIPELINE_PREDICTION_INPUT_BATCH_ROWS: "512"
  SC_PIPELINE_PREDICTION_PREPROCESS_TASK_ROWS: "64"
  SC_PIPELINE_PREDICTION_PREPROCESS_WORKERS: "4"
  SC_PIPELINE_PREDICTION_PREPROCESS_PREFETCH_TASKS: "8"
  SC_PIPELINE_TRAINING_MAX_ROWS: "100000"
  SC_PIPELINE_TRAINING_MAX_MATERIALIZED_BYTES: "8589934592"
  SC_PIPELINE_PREDICTION_PROGRESS_FLUSH_ROWS: "5000"
  SC_PIPELINE_PREDICTION_PROGRESS_FLUSH_SECONDS: "5.0"
  SC_PIPELINE_PREDICTION_WRITE_BATCH_ROWS: "5000"
  PREDICTION_COMPACTION_MEMORY_LIMIT: 512MiB
  PREDICTION_COMPACTION_TEMP_LIMIT: 4GiB
  PREDICTION_COMPACTION_ROW_GROUP_ROWS: "100000"

x-api-runtime: &api-runtime
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
    target: dev
    args:
      UV_INDEX_URL: ${UV_INDEX_URL:-}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-}
  volumes:
    - ../../apps/api:/app/apps/api
    - ../../libs/protos:/app/libs/protos
    - ../../libs/sampling-rules:/app/libs/sampling-rules
  environment:
    <<: *platform-environment
    UVICORN_TIMEOUT_KEEP_ALIVE: "120"
    UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: "600"
    UVICORN_TIMEOUT_WORKER_HEALTHCHECK: "60"
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    label-studio:
      condition: service_healthy
    prefect-server:
      condition: service_healthy
    redis:
      condition: service_healthy
    sc-upstream:
      condition: service_healthy
    image-parser:
      condition: service_healthy
  restart: on-failure

services:
  # ───────────────────────────────────────────────────────────────────
  # API — dev mode with bind mounts and hot reload. Platform preparation is
  # performed by the explicit prepare-platform one-shot before this starts.
  # ───────────────────────────────────────────────────────────────────
  api:
    <<: *api-runtime
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY:-4g}
    command:
      [
        "/bin/sh",
        "-lc",
        "cd /app/apps/api && exec uv run --no-dev --frozen uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/apps/api --reload-dir /app/libs/protos --reload-dir /app/libs/sampling-rules --timeout-keep-alive $${UVICORN_TIMEOUT_KEEP_ALIVE:-120} --timeout-graceful-shutdown $${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-600} --timeout-worker-healthcheck $${UVICORN_TIMEOUT_WORKER_HEALTHCHECK:-60}",
      ]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s

  sc-data-provider:
    <<: *api-runtime
    command:
      [
        "/bin/sh",
        "-lc",
        "cd /app/apps/api && PYTHONPATH=/app/libs/protos/src:/app/libs/sampling-rules/src exec /app/.venv/bin/uvicorn app.sc_data_provider_main:app --host 0.0.0.0 --port 8001 --reload --reload-dir /app/apps/api --reload-dir /app/libs/protos --reload-dir /app/libs/sampling-rules --timeout-keep-alive $${UVICORN_TIMEOUT_KEEP_ALIVE:-120} --timeout-graceful-shutdown $${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-600} --timeout-worker-healthcheck $${UVICORN_TIMEOUT_WORKER_HEALTHCHECK:-60}",
      ]
    deploy:
      resources:
        limits:
          memory: ${SC_DATA_PROVIDER_CONTAINER_MEMORY_LIMIT_MB:-6144}m
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../libs/protos:/app/libs/protos
      - ../../libs/sampling-rules:/app/libs/sampling-rules
      - sc-data-provider-cache:/var/cache/sc-data-provider
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  # ───────────────────────────────────────────────────────────────────
  # Web — Vite dev server with bind mount + hot module replacement
  # ───────────────────────────────────────────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: dev
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY:-2g}
    volumes:
      - ../../apps/web:/app/apps/web
      - ../../packages/sc-map-element:/app/packages/sc-map-element
    environment:
      VITE_PROXY_TARGET: "http://api:8000"
      VITE_SC_DATA_PROVIDER_TARGET: "http://sc-data-provider:8001"
      VITE_API_BASE_URL: "http://api:8000"
      VITE_IMAGE_PARSER_TARGET: "http://image-parser:8090"
    command: sh -lc "rm -rf node_modules/.vite && pnpm dev --host 0.0.0.0 --port 5173 --force"
    depends_on:
      - api
      - sc-data-provider
    ports:
      - "5173:5173"
    restart: on-failure

  # ───────────────────────────────────────────────────────────────────
  # image-parser — Go hot reload with bind-mounted service sources
  # ───────────────────────────────────────────────────────────────────
  image-parser:
    build:
      context: ../..
      dockerfile: services/image-parser/Dockerfile
      target: dev
    deploy:
      resources:
        limits:
          memory: ${IMAGE_PARSER_MEMORY:-2g}
    depends_on:
      sc-upstream:
        condition: service_healthy
    volumes:
      - ../../services/image-parser:/app/services/image-parser
    environment:
      PORT: "8090"
      GRPC_PORT: "9092"
      CACHE_DIR: /tmp/image-parser-cache
      CACHE_TTL: ${IMAGE_PARSER_CACHE_TTL:-10m}
      CACHE_CLEANUP_INTERVAL: ${IMAGE_PARSER_CACHE_CLEANUP_INTERVAL:-5m}
      CACHE_MAX_BYTES: ${IMAGE_PARSER_CACHE_MAX_BYTES:-1073741824}
    ports:
      - "8090:8090"
      - "9092:9092"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s
    restart: on-failure

  # ───────────────────────────────────────────────────────────────────
  # sc-upstream — Python hot reload with bind-mounted service + proto stubs
  # ───────────────────────────────────────────────────────────────────
  sc-upstream:
    build:
      context: ../..
      dockerfile: services/sc-upstream/Dockerfile
    deploy:
      resources:
        limits:
          memory: ${SC_UPSTREAM_MEMORY:-2g}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ../../services/sc-upstream:/app/services/sc-upstream
      - ../../libs/protos:/app/libs/protos
    command:
      [
        "/bin/sh",
        "-lc",
        "cd /app/services/sc-upstream && uv sync --frozen --package sc-upstream && exec /app/.venv/bin/python -m watchfiles --filter python --target-type command '/app/.venv/bin/python -m sc_upstream.server' /app/services/sc-upstream/src /app/libs/protos/src",
      ]
    environment:
      PYTHONPATH: /app/libs/protos/src
      GRPC_PORT: "9091"
      FLIGHT_PORT: "9093"
      CACHE_DIR: /data/cache
      SC_UPSTREAM_CACHE_SIZE_LIMIT_BYTES: ${SC_UPSTREAM_CACHE_SIZE_LIMIT_BYTES:-10737418240}
      SC_UPSTREAM_RAW_CACHE_CLEANUP_INTERVAL_SECONDS: ${SC_UPSTREAM_RAW_CACHE_CLEANUP_INTERVAL_SECONDS:-7200}
      REDIS_URL: redis://redis:6379/0
    expose:
      - "9091"
      - "9093"
    ports:
      - "9091:9091"
      - "9093:9093"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 9091), timeout=20); s.close()",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s
    restart: on-failure

  # ───────────────────────────────────────────────────────────────────
  # Prefect CPU worker — bind-mounted sources for fast iteration
  # ───────────────────────────────────────────────────────────────────
  prefect-worker-cpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-cpu
      target: dev
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    deploy:
      resources:
        limits:
          memory: ${CPU_WORKER_MEMORY:-4g}
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../libs/protos:/app/libs/protos
      - ../../apps/api/app/modules/types/ml:/app/apps/api/app/modules/types/ml
    environment:
      <<: *platform-environment
      PYTHONPATH: /app/libs/protos/src
    depends_on:
      prefect-server:
        condition: service_healthy
      image-parser:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────
  # Prefect GPU worker — profile-gated (Linux/NVIDIA only)
  # ───────────────────────────────────────────────────────────────────
  prefect-worker-gpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-gpu
      target: dev
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    profiles:
      - gpu
    deploy:
      resources:
        limits:
          memory: ${GPU_WORKER_MEMORY:-16g}
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../libs/protos:/app/libs/protos
      - ../../apps/api/app/modules/types/ml:/app/apps/api/app/modules/types/ml
    environment:
      <<: *platform-environment
      PYTHONPATH: /app/libs/protos/src
      SC_JOB_IMAGE_RESOLVER_BINARY: ${SC_JOB_IMAGE_RESOLVER_BINARY:-/usr/local/bin/image-parser-batch}
      SC_JOB_IMAGE_RESOLVER_CACHE_ROOT: /tmp/sc-job-image-resolver
      IMAGE_SOURCE_ROOT: ${IMAGE_SOURCE_ROOT:-}
      IMAGE_SOURCE_KIND: ${IMAGE_SOURCE_KIND:-}
      IMAGE_SOURCE_FORMAT: ${IMAGE_SOURCE_FORMAT:-}
    depends_on:
      prefect-server:
        condition: service_healthy
      image-parser:
        condition: service_healthy
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────
  # Platform preparation — migrations, MinIO policy, Prefect registrations
  # ───────────────────────────────────────────────────────────────────
  prepare-platform:
    <<: *api-runtime
    profiles: ["ops"]
    deploy:
      resources:
        limits:
          memory: ${PLATFORM_PREPARE_MEMORY:-2g}
    command: ["/app/.venv/bin/python", "scripts/prepare_platform.py"]
    restart: "no"

  # ───────────────────────────────────────────────────────────────────
  # pgAdmin — PostgreSQL web admin UI
  # ───────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:9.16
    deploy:
      resources:
        limits:
          memory: ${PGADMIN_MEMORY:-1g}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin-pgpass:/pgpass:ro
    restart: on-failure

# ─────────────────────────────────────────────────────────────────────
# Named volumes (dev‑only — base volumes are in docker-compose.yaml)
# ─────────────────────────────────────────────────────────────────────
volumes:
  pgadmin-data:
