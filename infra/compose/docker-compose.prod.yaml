services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: prod
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      redis:
        condition: service_started
      sc-upstream:
        condition: service_healthy
      image-parser:
        condition: service_healthy
    environment:
      APP_CONFIG_PROFILE: prod
      MNT: /mnt
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_URL: http://localhost:4200
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
      LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
      LABEL_STUDIO_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/labelstudio"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      SC_PATCH_S3_ENDPOINT: minio:9000
      SC_PATCH_S3_ACCESS_KEY: minioadmin
      SC_PATCH_S3_SECRET_KEY: minioadmin
      SC_PATCH_S3_BUCKET: sc-patch-images
      SC_REVIEW_S3_ENDPOINT: minio:9000
      SC_REVIEW_S3_ACCESS_KEY: minioadmin
      SC_REVIEW_S3_SECRET_KEY: minioadmin
      SC_REVIEW_S3_BUCKET: sc-review-images
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen-max}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    mem_limit: ${API_MEMORY:-8g}
    shm_size: ${API_SHM_SIZE:-1g}
    volumes:
      - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    depends_on:
      - api
    mem_limit: ${WEB_MEMORY:-1g}
    ports:
      - "5173:80"
    restart: unless-stopped

  prefect-worker-cpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-cpu
      target: prod
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      APP_CONFIG_PROFILE: prod
      MNT: /mnt
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      SC_PATCH_S3_ENDPOINT: minio:9000
      SC_PATCH_S3_ACCESS_KEY: minioadmin
      SC_PATCH_S3_SECRET_KEY: minioadmin
      SC_PATCH_S3_BUCKET: sc-patch-images
      SC_REVIEW_S3_ENDPOINT: minio:9000
      SC_REVIEW_S3_ACCESS_KEY: minioadmin
      SC_REVIEW_S3_SECRET_KEY: minioadmin
      SC_REVIEW_S3_BUCKET: sc-review-images
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
      LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    mem_limit: ${CPU_WORKER_MEMORY:-8g}
    shm_size: ${CPU_WORKER_SHM_SIZE:-1g}
    volumes:
      - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
    restart: unless-stopped

  prefect-worker-gpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-gpu
      target: prod
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      APP_CONFIG_PROFILE: prod
      MNT: /mnt
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      SC_PATCH_S3_ENDPOINT: minio:9000
      SC_PATCH_S3_ACCESS_KEY: minioadmin
      SC_PATCH_S3_SECRET_KEY: minioadmin
      SC_PATCH_S3_BUCKET: sc-patch-images
      SC_REVIEW_S3_ENDPOINT: minio:9000
      SC_REVIEW_S3_ACCESS_KEY: minioadmin
      SC_REVIEW_S3_SECRET_KEY: minioadmin
      SC_REVIEW_S3_BUCKET: sc-review-images
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
      LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    mem_limit: ${GPU_WORKER_MEMORY:-16g}
    shm_size: ${GPU_WORKER_SHM_SIZE:-2g}
    volumes:
      - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
    restart: unless-stopped

  sc-upstream:
    build:
      context: ../..
      dockerfile: services/sc-upstream/Dockerfile
    depends_on:
      redis:
        condition: service_started
    environment:
      - GRPC_PORT=9091
      - FLIGHT_PORT=9093
      - UPSTREAM_DB_URL=${UPSTREAM_DB_URL:-sqlite:////data/wafer_inspection.db}
      - ZIPS_DB_URL=${ZIPS_DB_URL:-sqlite:////data/inspection_zips.db}
      - CACHE_DIR=/data/cache
      - REDIS_URL=redis://redis:6379/0
    mem_limit: ${SC_UPSTREAM_MEMORY:-8g}
    shm_size: ${SC_UPSTREAM_SHM_SIZE:-1g}
    expose:
      - "9091"
      - "9093"
    volumes:
      - ${SC_UPSTREAM_DATA_DIR:-./data/sc-upstream}:/data
    restart: unless-stopped

  image-parser:
    build:
      context: ../..
      dockerfile: services/image-parser/Dockerfile
    depends_on:
      sc-upstream:
        condition: service_healthy
    environment:
      - PORT=8090
      - GRPC_PORT=9092
      - CACHE_SIZE_MB=${IMAGE_PARSER_CACHE_SIZE_MB:-32768}
      - S3_MAX_CONNS=1000
      - S3_ENDPOINT=${S3_ENDPOINT:-minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_ZIPS_ACCESS_KEY=${S3_ZIPS_ACCESS_KEY:-${S3_ACCESS_KEY:-minioadmin}}
      - S3_ZIPS_SECRET_KEY=${S3_ZIPS_SECRET_KEY:-${S3_SECRET_KEY:-minioadmin}}
      - S3_REVIEW_ACCESS_KEY=${S3_REVIEW_ACCESS_KEY:-${S3_ACCESS_KEY:-minioadmin}}
      - S3_REVIEW_SECRET_KEY=${S3_REVIEW_SECRET_KEY:-${S3_SECRET_KEY:-minioadmin}}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_PATH_STYLE=true
      - SC_UPSTREAM_ADDR=sc-upstream:9091
    mem_limit: ${IMAGE_PARSER_MEMORY:-32g}
    shm_size: ${IMAGE_PARSER_SHM_SIZE:-2g}
    ports:
      - "8090:8090"
      - "9092:9092"
    volumes:
      - ${IMAGE_PARSER_DATA_DIR:-./data/image-parser}:/data
    restart: unless-stopped
