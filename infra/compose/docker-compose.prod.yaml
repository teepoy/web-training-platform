services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: prod
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_CONFIG_PROFILE: prod
      MNT: /mnt
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_URL: http://localhost:4200
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
      LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
      LABEL_STUDIO_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/labelstudio"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      SC_PATCH_S3_ENDPOINT: minio:9000
      SC_PATCH_S3_ACCESS_KEY: minioadmin
      SC_PATCH_S3_SECRET_KEY: minioadmin
      SC_PATCH_S3_BUCKET: sc-patch-images
      SC_REVIEW_S3_ENDPOINT: minio:9000
      SC_REVIEW_S3_ACCESS_KEY: minioadmin
      SC_REVIEW_S3_SECRET_KEY: minioadmin
      SC_REVIEW_S3_BUCKET: sc-review-images
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen-max}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./data:/mnt
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

  prefect-worker-cpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-cpu
      target: prod
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      APP_CONFIG_PROFILE: prod
      MNT: /mnt
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      SC_PATCH_S3_ENDPOINT: minio:9000
      SC_PATCH_S3_ACCESS_KEY: minioadmin
      SC_PATCH_S3_SECRET_KEY: minioadmin
      SC_PATCH_S3_BUCKET: sc-patch-images
      SC_REVIEW_S3_ENDPOINT: minio:9000
      SC_REVIEW_S3_ACCESS_KEY: minioadmin
      SC_REVIEW_S3_SECRET_KEY: minioadmin
      SC_REVIEW_S3_BUCKET: sc-review-images
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
      LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./data:/mnt
    restart: unless-stopped

  prefect-worker-gpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-gpu
      target: prod
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      APP_CONFIG_PROFILE: prod
      MNT: /mnt
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: finetune-artifacts
      SC_PATCH_S3_ENDPOINT: minio:9000
      SC_PATCH_S3_ACCESS_KEY: minioadmin
      SC_PATCH_S3_SECRET_KEY: minioadmin
      SC_PATCH_S3_BUCKET: sc-patch-images
      SC_REVIEW_S3_ENDPOINT: minio:9000
      SC_REVIEW_S3_ACCESS_KEY: minioadmin
      SC_REVIEW_S3_SECRET_KEY: minioadmin
      SC_REVIEW_S3_BUCKET: sc-review-images
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
      LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./data:/mnt
    restart: unless-stopped

  sc-upstream:
    build:
      context: ../..
      dockerfile: services/sc-upstream/Dockerfile
    environment:
      - GRPC_PORT=9091
      - FLIGHT_PORT=9093
      - UPSTREAM_DB_URL=${UPSTREAM_DB_URL:-sqlite:////data/wafer_inspection.db}
      - ZIPS_DB_URL=${ZIPS_DB_URL:-sqlite:////data/inspection_zips.db}
      - CACHE_DIR=/data/cache
    expose:
      - "9091"
      - "9093"
    volumes:
      - ./data:/data
    restart: unless-stopped

  image-parser:
    build:
      context: ../..
      dockerfile: services/image-parser/Dockerfile
    depends_on:
      - sc-upstream
    environment:
      - PORT=8090
      - GRPC_PORT=9092
      - CACHE_SIZE_MB=${IMAGE_PARSER_CACHE_SIZE_MB:-32768}
      - S3_MAX_CONNS=1000
      - S3_ENDPOINT=${S3_ENDPOINT:-minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_ZIPS_ACCESS_KEY=${S3_ZIPS_ACCESS_KEY:-${S3_ACCESS_KEY:-minioadmin}}
      - S3_ZIPS_SECRET_KEY=${S3_ZIPS_SECRET_KEY:-${S3_SECRET_KEY:-minioadmin}}
      - S3_REVIEW_ACCESS_KEY=${S3_REVIEW_ACCESS_KEY:-${S3_ACCESS_KEY:-minioadmin}}
      - S3_REVIEW_SECRET_KEY=${S3_REVIEW_SECRET_KEY:-${S3_SECRET_KEY:-minioadmin}}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_PATH_STYLE=true
      - SC_UPSTREAM_ADDR=sc-upstream:9091
    ports:
      - "8090:8090"
      - "9092:9092"
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # Observability Stack — --profile observability
  # ═══════════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v3.3.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.4.0
    profiles: ["observability"]
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.0
    profiles: ["observability"]
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    depends_on:
      - loki

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["observability"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    profiles: ["observability"]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--port=8080"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: ["observability"]
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  prefect-exporter:
    image: prefecthq/prefect:3.6.25-python3.12
    profiles: ["observability"]
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      EXPORTER_PORT: "8000"
    command:
      - python
      - /exporter/exporter.py
    volumes:
      - ./observability/prefect-exporter/exporter.py:/exporter/exporter.py:ro
    restart: unless-stopped
    depends_on:
      - prefect-server

  # ═══════════════════════════════════════════════════════════════════
  # GPU Monitoring — --profile gpu  (Linux + NVIDIA only)
  # ═══════════════════════════════════════════════════════════════════
  dcgm-exporter:
    image: nvidia/dcgm-exporter:3.4.1-3.6.2-ubuntu22.04
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  redis-data:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:
