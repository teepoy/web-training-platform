  SC_DATA_PROVIDER_WORKER_COUNT: ${SC_DATA_PROVIDER_WORKER_COUNT:-4}
  SC_DATA_PROVIDER_CONTAINER_MEMORY_LIMIT_MB: ${SC_DATA_PROVIDER_CONTAINER_MEMORY_LIMIT_MB:-6144}
  SC_DATA_PROVIDER_PYTHON_OVERHEAD_MB: "256"
  SC_DATA_PROVIDER_SERVICE_HEADROOM_MB: "512"
  SC_DATA_PROVIDER_OBJECT_CACHE_MAX_BYTES: "10737418240"
  SC_DATA_PROVIDER_OBJECT_CACHE_LOW_WATERMARK_BYTES: "8589934592"
  SC_DATA_PROVIDER_OBJECT_IDLE_TTL_SECONDS: "3600"
  SC_DATA_PROVIDER_CLEANUP_INTERVAL_SECONDS: "60"
  SC_DATA_PROVIDER_STALE_WRITE_SECONDS: "300"
  SC_DATA_PROVIDER_LEASE_TTL_SECONDS: "60"
  SC_DATA_PROVIDER_LEASE_HEARTBEAT_SECONDS: "20"
  SC_DATA_PROVIDER_BUILD_LOCK_TTL_SECONDS: "60"
  SC_DATA_PROVIDER_BUILD_LOCK_HEARTBEAT_SECONDS: "20"
  SC_DATA_PROVIDER_BUILD_WAIT_TIMEOUT_SECONDS: "30"
  SC_DATA_PROVIDER_BUILD_POLL_INTERVAL_MS: "100"
  SC_DATA_PROVIDER_SQL_TIMEOUT_SECONDS: "30"
  SC_DATA_PROVIDER_MAX_RESPONSE_BYTES: "268435456"
  SC_DATA_PROVIDER_ARROW_BATCH_ROWS: "16384"
  SC_DATA_PROVIDER_STREAM_QUEUE_CAPACITY: "8"
  SC_DATA_PROVIDER_STREAM_QUEUE_POLL_INTERVAL_MS: "100"
  SC_DATA_PROVIDER_SSE_HEARTBEAT_SECONDS: "15"
  SC_PIPELINE_IMPORT_BATCH_ROWS: "25000"
  SC_PIPELINE_INDEX_ROW_GROUP_ROWS: "65536"
  SC_PIPELINE_MATERIALIZATION_BATCH_ROWS: "512"
  SC_PIPELINE_MATERIALIZATION_MAX_ERROR_RECORDS: "1000"
  SC_PIPELINE_PREDICTION_MAX_MATERIALIZED_BYTES: "17179869184"
  SC_PIPELINE_TRAINING_MAX_ROWS: "100000"
  SC_PIPELINE_TRAINING_MAX_MATERIALIZED_BYTES: "8589934592"
  PREDICTION_PROGRESS_FLUSH_ROWS: "5000"
  PREDICTION_PROGRESS_FLUSH_SECONDS: "5.0"
  PREDICTION_WRITE_BATCH_ROWS: "5000"
  PREDICTION_COMPACTION_MEMORY_LIMIT: 512MiB
  PREDICTION_COMPACTION_TEMP_LIMIT: 4GiB
  PREDICTION_COMPACTION_ROW_GROUP_ROWS: "100000"

x-api-runtime: &api-runtime
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
    target: prod
    args:
      UV_INDEX_URL: ${UV_INDEX_URL:-}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-}
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    prefect-server:
      condition: service_healthy
    label-studio:
      condition: service_healthy
    redis:
      condition: service_started
    sc-upstream:
      condition: service_healthy
    image-parser:
      condition: service_healthy
  environment: *platform-environment
  shm_size: ${API_SHM_SIZE:-1g}
  volumes:
    - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
  restart: unless-stopped

services:
  prefect-server:
    environment:
      PREFECT_SERVER_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING:-dangerous:dangerous}

  api:
    <<: *api-runtime
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY:-4g}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s

  sc-data-provider:
    <<: *api-runtime
    command:
      [
        "/app/.venv/bin/uvicorn",
        "app.sc_data_provider_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--workers",
        "${SC_DATA_PROVIDER_WORKER_COUNT:-4}",
      ]
    deploy:
      resources:
        limits:
          memory: ${SC_DATA_PROVIDER_CONTAINER_MEMORY_LIMIT_MB:-6144}m
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    depends_on:
      - api
      - sc-data-provider
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY:-1g}
    ports:
      - "5173:80"
    restart: unless-stopped

  prefect-exporter:
    environment:
      PREFECT_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING:-dangerous:dangerous}

  prefect-worker-cpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-cpu
      target: prod
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      <<: *platform-environment
      PREFECT_WORKER_LIMIT: ${CPU_PREFECT_WORKER_LIMIT:-2}
    deploy:
      resources:
        limits:
          memory: ${CPU_WORKER_MEMORY:-4g}
    shm_size: ${CPU_WORKER_SHM_SIZE:-1g}
    volumes:
      - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
    restart: unless-stopped

  prefect-worker-gpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-gpu
      target: prod
    profiles:
      - gpu
    deploy:
      resources:
        limits:
          memory: ${GPU_WORKER_MEMORY:-16g}
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      <<: *platform-environment
      PREFECT_WORKER_LIMIT: ${GPU_PREFECT_WORKER_LIMIT:-1}
    shm_size: ${GPU_WORKER_SHM_SIZE:-2g}
    volumes:
      - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
    restart: unless-stopped

  sc-upstream:
    build:
      context: ../..
      dockerfile: services/sc-upstream/Dockerfile
    depends_on:
      redis:
        condition: service_started
    environment:
      - GRPC_PORT=9091
      - FLIGHT_PORT=9093
      - CACHE_DIR=/data/cache
      - SC_UPSTREAM_CACHE_SIZE_LIMIT_BYTES=${SC_UPSTREAM_CACHE_SIZE_LIMIT_BYTES:-10737418240}
      - SC_UPSTREAM_RAW_CACHE_CLEANUP_INTERVAL_SECONDS=${SC_UPSTREAM_RAW_CACHE_CLEANUP_INTERVAL_SECONDS:-7200}
      - REDIS_URL=redis://redis:6379/0
      # Mock SQLite DB paths use sc-upstream service defaults.
    deploy:
      resources:
        limits:
          memory: ${SC_UPSTREAM_MEMORY:-4g}
    shm_size: ${SC_UPSTREAM_SHM_SIZE:-1g}
    expose:
      - "9091"
      - "9093"
    volumes:
      - ${SC_UPSTREAM_DATA_DIR:-./data/sc-upstream}:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('localhost', 9091), timeout=20); s.close()",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s

  image-parser:
    build:
      context: ../..
      dockerfile: services/image-parser/Dockerfile
    depends_on:
      sc-upstream:
        condition: service_healthy
    environment:
      - PORT=8090
      - GRPC_PORT=9092
      - CACHE_SIZE_MB=${IMAGE_PARSER_CACHE_SIZE_MB:-32768}
      - CACHE_DIR=/tmp/image-parser-cache
      - CACHE_TTL=${IMAGE_PARSER_CACHE_TTL:-10m}
      - CACHE_CLEANUP_INTERVAL=${IMAGE_PARSER_CACHE_CLEANUP_INTERVAL:-5m}
      - CACHE_MAX_BYTES=${IMAGE_PARSER_CACHE_MAX_BYTES:-34359738368}
      - S3_MAX_CONNS=1000
      - SC_UPSTREAM_ADDR=sc-upstream:9091
      # Mock S3 endpoint/credentials use image-parser service defaults.
    deploy:
      resources:
        limits:
          memory: ${IMAGE_PARSER_MEMORY:-8g}
    shm_size: ${IMAGE_PARSER_SHM_SIZE:-2g}
    ports:
      - "8090:8090"
      - "9092:9092"
    volumes:
      - ${IMAGE_PARSER_DATA_DIR:-./data/image-parser}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s
