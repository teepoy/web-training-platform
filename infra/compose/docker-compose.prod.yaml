x-platform-environment: &platform-environment
  APP_CONFIG_PROFILE: prod
  FRONTEND_URL: http://localhost:5173
  JWT_SECRET_KEY: local-prod-validation-only-change-me
  MNT: /mnt
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/finetune
  PREFECT_API_URL: http://prefect-server:4200/api
  PREFECT_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING:-dangerous:dangerous}
  PREFECT_UI_URL: http://localhost:4200
  LABEL_STUDIO_URL: "http://label-studio:8080"
  LABEL_STUDIO_EXTERNAL_URL: "http://localhost:8080"
  LABEL_STUDIO_API_KEY: "ls-smoke-token-for-local-dev"
  LABEL_STUDIO_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/labelstudio"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: finetune-artifacts
  SC_PATCH_S3_ENDPOINT: minio:9000
  SC_PATCH_S3_ACCESS_KEY: minioadmin
  SC_PATCH_S3_SECRET_KEY: minioadmin
  SC_PATCH_S3_BUCKET: sc-patch-images
  SC_REVIEW_S3_ENDPOINT: minio:9000
  SC_REVIEW_S3_ACCESS_KEY: minioadmin
  SC_REVIEW_S3_SECRET_KEY: minioadmin
  SC_REVIEW_S3_BUCKET: sc-review-images
  SC_UPSTREAM_ADDR: sc-upstream:9091
  SC_UPSTREAM_FLIGHT_ADDR: grpc://sc-upstream:9093
  IMAGE_PARSER_GRPC_ADDR: image-parser:9092
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-qwen/qwen-max}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  PERSPECTIVE_WS_MALLOC_CONF: ${PERSPECTIVE_WS_MALLOC_CONF:-background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000,retain:false}

x-api-runtime: &api-runtime
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
    target: prod
    args:
      UV_INDEX_URL: ${UV_INDEX_URL:-}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-}
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    prefect-server:
      condition: service_healthy
    label-studio:
      condition: service_healthy
    redis:
      condition: service_started
    sc-upstream:
      condition: service_healthy
    image-parser:
      condition: service_healthy
  environment: *platform-environment
  shm_size: ${API_SHM_SIZE:-1g}
  volumes:
    - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
  restart: unless-stopped

services:
  prefect-server:
    environment:
      PREFECT_SERVER_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING:-dangerous:dangerous}

  api:
    <<: *api-runtime
    mem_limit: ${API_MEMORY:-4g}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s

  perspective-ws:
    <<: *api-runtime
    command:
      [
        "python",
        "/app/apps/api/scripts/perspective_container_watchdog.py",
        "--",
        "/usr/bin/supervisord",
        "-c",
        "/app/apps/api/supervisord.perspective.conf",
      ]
    mem_limit: ${PERSPECTIVE_WS_MEMORY:-4g}
    ports:
      - "8001:8001"
    expose:
      - "8002"
      - "8003"
      - "8004"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/app/apps/api/scripts/perspective_healthcheck.py",
          "--url",
          "http://localhost:8001/ready",
          "--url",
          "http://localhost:8002/ready",
          "--url",
          "http://localhost:8003/ready",
          "--url",
          "http://localhost:8004/ready",
          "--timeout-seconds",
          "2",
          "--failure-threshold",
          "3",
          "--startup-grace-seconds",
          "60",
          "--force-container-restart",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    depends_on:
      - api
      - perspective-ws
    mem_limit: ${WEB_MEMORY:-1g}
    ports:
      - "5173:80"
    restart: unless-stopped

  prefect-exporter:
    environment:
      PREFECT_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING:-dangerous:dangerous}

  prefect-worker-cpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-cpu
      target: prod
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      <<: *platform-environment
      PREFECT_WORKER_LIMIT: ${CPU_PREFECT_WORKER_LIMIT:-2}
    mem_limit: ${CPU_WORKER_MEMORY:-4g}
    shm_size: ${CPU_WORKER_SHM_SIZE:-1g}
    volumes:
      - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
    restart: unless-stopped

  prefect-worker-gpu:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.prefect-worker-gpu
      target: prod
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      <<: *platform-environment
      PREFECT_WORKER_LIMIT: ${GPU_PREFECT_WORKER_LIMIT:-1}
    mem_limit: ${GPU_WORKER_MEMORY:-16g}
    shm_size: ${GPU_WORKER_SHM_SIZE:-2g}
    volumes:
      - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
    restart: unless-stopped

  sc-upstream:
    build:
      context: ../..
      dockerfile: services/sc-upstream/Dockerfile
    depends_on:
      redis:
        condition: service_started
    environment:
      - GRPC_PORT=9091
      - FLIGHT_PORT=9093
      - CACHE_DIR=/data/cache
      - SC_UPSTREAM_CACHE_SIZE_LIMIT_BYTES=${SC_UPSTREAM_CACHE_SIZE_LIMIT_BYTES:-10737418240}
      - SC_UPSTREAM_RAW_CACHE_CLEANUP_INTERVAL_SECONDS=${SC_UPSTREAM_RAW_CACHE_CLEANUP_INTERVAL_SECONDS:-7200}
      - REDIS_URL=redis://redis:6379/0
      # Mock SQLite DB paths use sc-upstream service defaults.
    mem_limit: ${SC_UPSTREAM_MEMORY:-4g}
    shm_size: ${SC_UPSTREAM_SHM_SIZE:-1g}
    expose:
      - "9091"
      - "9093"
    volumes:
      - ${SC_UPSTREAM_DATA_DIR:-./data/sc-upstream}:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('localhost', 9091), timeout=20); s.close()",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s

  image-parser:
    build:
      context: ../..
      dockerfile: services/image-parser/Dockerfile
    depends_on:
      sc-upstream:
        condition: service_healthy
    environment:
      - PORT=8090
      - GRPC_PORT=9092
      - CACHE_SIZE_MB=${IMAGE_PARSER_CACHE_SIZE_MB:-32768}
      - CACHE_DIR=/tmp/image-parser-cache
      - CACHE_TTL=${IMAGE_PARSER_CACHE_TTL:-10m}
      - CACHE_CLEANUP_INTERVAL=${IMAGE_PARSER_CACHE_CLEANUP_INTERVAL:-5m}
      - CACHE_MAX_BYTES=${IMAGE_PARSER_CACHE_MAX_BYTES:-34359738368}
      - S3_MAX_CONNS=1000
      - SC_UPSTREAM_ADDR=sc-upstream:9091
      # Mock S3 endpoint/credentials use image-parser service defaults.
    mem_limit: ${IMAGE_PARSER_MEMORY:-8g}
    shm_size: ${IMAGE_PARSER_SHM_SIZE:-2g}
    ports:
      - "8090:8090"
      - "9092:9092"
    volumes:
      - ${IMAGE_PARSER_DATA_DIR:-./data/image-parser}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s
