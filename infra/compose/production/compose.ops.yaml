# Operational one-shot services — run with --profile ops.
# No long-running services here. These services exit after completion.
# Use the same .env file as the platform project.
# The platform environment block is intentionally repeated from
# compose.platform.yaml: these are separate Compose projects and YAML anchors
# cannot cross files. scripts/check_compose_parity.py guards the shared keys.

x-platform-environment: &platform-environment
  APP_CONFIG_PROFILE: ${APP_CONFIG_PROFILE:?Set APP_CONFIG_PROFILE to pre-release or prod}
  FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
  OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
  OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
  OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
  OAUTH_CUSTOM_CLIENT_ID: ${OAUTH_CUSTOM_CLIENT_ID:-}
  OAUTH_CUSTOM_CLIENT_SECRET: ${OAUTH_CUSTOM_CLIENT_SECRET:-}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  PREFECT_API_URL: http://prefect-server:4200/api
  PREFECT_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING:?Set PREFECT_SERVER_API_AUTH_STRING}
  PREFECT_UI_URL: ${PREFECT_UI_URL:?Set PREFECT_UI_URL}
  LABEL_STUDIO_URL: http://label-studio:8080
  LABEL_STUDIO_EXTERNAL_URL: ${LABEL_STUDIO_EXTERNAL_URL:?Set LABEL_STUDIO_EXTERNAL_URL}
  LABEL_STUDIO_API_KEY: ${LABEL_STUDIO_API_KEY:?Set LABEL_STUDIO_API_KEY}
  LABEL_STUDIO_DATABASE_URL: ${LABEL_STUDIO_DATABASE_URL:?Set LABEL_STUDIO_DATABASE_URL}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
  SC_PATCH_S3_ENDPOINT: ${SC_PATCH_S3_ENDPOINT:-minio:9000}
  SC_PATCH_S3_ACCESS_KEY: ${SC_PATCH_S3_ACCESS_KEY:?Set SC_PATCH_S3_ACCESS_KEY}
  SC_PATCH_S3_SECRET_KEY: ${SC_PATCH_S3_SECRET_KEY:?Set SC_PATCH_S3_SECRET_KEY}
  SC_PATCH_S3_BUCKET: ${SC_PATCH_S3_BUCKET:-sc-patch-images}
  SC_REVIEW_S3_ENDPOINT: ${SC_REVIEW_S3_ENDPOINT:-minio:9000}
  SC_REVIEW_S3_ACCESS_KEY: ${SC_REVIEW_S3_ACCESS_KEY:?Set SC_REVIEW_S3_ACCESS_KEY}
  SC_REVIEW_S3_SECRET_KEY: ${SC_REVIEW_S3_SECRET_KEY:?Set SC_REVIEW_S3_SECRET_KEY}
  SC_REVIEW_S3_BUCKET: ${SC_REVIEW_S3_BUCKET:-sc-review-images}
  IMAGE_PARSER_GRPC_ADDR: image-parser:9092
  SC_DATA_PROVIDER_CACHE_DIR: /mnt/sc-data-provider-cache
  SC_DATA_PROVIDER_CACHE_NAMESPACE: sc-data-provider
  PLATFORM_API_URL: http://api:8000
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}

services:
  prepare-platform:
    image: ${FINETUNE_API_IMAGE:?Set FINETUNE_API_IMAGE to an immutable tag}
    profiles: ["ops"]
    deploy:
      resources:
        limits:
          memory: ${PLATFORM_PREPARE_MEMORY:-2g}
    environment: *platform-environment
    command: ["/app/.venv/bin/python", "scripts/prepare_platform.py"]
    networks:
      finetune-prod:
    restart: "no"

networks:
  finetune-prod:
    external: true
    name: ${PLATFORM_NETWORK_NAME:?Set PLATFORM_NETWORK_NAME}
