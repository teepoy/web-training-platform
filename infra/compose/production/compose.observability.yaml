services:
  prometheus:
    image: prom/prometheus:v3.3.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ${OBS_CONFIG_DIR:-../observability}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${OBS_CONFIG_DIR:-../observability}/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      finetune-prod:
        aliases:
          - prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${OBS_CONFIG_DIR:-../observability}/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      finetune-prod:
        aliases:
          - grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.0
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ${OBS_CONFIG_DIR:-../observability}/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      finetune-prod:
        aliases:
          - loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.0
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ${OBS_CONFIG_DIR:-../observability}/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      finetune-prod:
    depends_on:
      - loki
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ${ALERTMANAGER_CONFIG_PATH:?Set ALERTMANAGER_CONFIG_PATH}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"
    networks:
      finetune-prod:
        aliases:
          - alertmanager
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--port=8080"
    networks:
      finetune-prod:
        aliases:
          - cadvisor
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      finetune-prod:
        aliases:
          - node-exporter
    restart: unless-stopped

  prefect-exporter:
    image: prefecthq/prefect:3.6.25-python3.12
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING:?Set PREFECT_SERVER_API_AUTH_STRING}
      EXPORTER_PORT: "8000"
    command: ["python", "/exporter/exporter.py"]
    volumes:
      - ${EXPORTER_DIR:-../observability/prefect-exporter}/exporter.py:/exporter/exporter.py:ro
    networks:
      finetune-prod:
        aliases:
          - prefect-exporter
    restart: unless-stopped

  dcgm-exporter:
    image: nvidia/dcgm-exporter:3.4.1-3.6.2-ubuntu22.04
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    networks:
      finetune-prod:
        aliases:
          - dcgm-exporter
    restart: unless-stopped

networks:
  finetune-prod:
    external: true
    name: ${PLATFORM_NETWORK_NAME:?Set PLATFORM_NETWORK_NAME}

volumes:
  prometheus-data:
    name: finetune-prometheus-data
  grafana-data:
    name: finetune-grafana-data
  loki-data:
    name: finetune-loki-data
  alertmanager-data:
    name: finetune-alertmanager-data
