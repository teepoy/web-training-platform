# Stateless app plane — released with application versions.
# Holds: prefect-server, api, web, prefect-worker-cpu, prefect-worker-gpu.
# Start after the stateful data plane (postgres, redis, minio, label-studio) is up.
# Note: prefect-server persists state in the stateful project's postgres.

x-platform-environment: &platform-environment
  APP_CONFIG_PROFILE: ${APP_CONFIG_PROFILE:?Set APP_CONFIG_PROFILE to pre-release or prod}
  FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
  OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
  OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
  OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
  OAUTH_CUSTOM_CLIENT_ID: ${OAUTH_CUSTOM_CLIENT_ID:-}
  OAUTH_CUSTOM_CLIENT_SECRET: ${OAUTH_CUSTOM_CLIENT_SECRET:-}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  PREFECT_API_URL: http://prefect-server:4200/api
  PREFECT_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING:?Set PREFECT_SERVER_API_AUTH_STRING}
  PREFECT_UI_URL: ${PREFECT_UI_URL:?Set PREFECT_UI_URL}
  LABEL_STUDIO_URL: http://label-studio:8080
  LABEL_STUDIO_EXTERNAL_URL: ${LABEL_STUDIO_EXTERNAL_URL:?Set LABEL_STUDIO_EXTERNAL_URL}
  LABEL_STUDIO_API_KEY: ${LABEL_STUDIO_API_KEY:?Set LABEL_STUDIO_API_KEY}
  LABEL_STUDIO_DATABASE_URL: ${LABEL_STUDIO_DATABASE_URL:?Set LABEL_STUDIO_DATABASE_URL}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
  SC_PATCH_S3_ENDPOINT: ${SC_PATCH_S3_ENDPOINT:-minio:9000}
  SC_PATCH_S3_ACCESS_KEY: ${SC_PATCH_S3_ACCESS_KEY:?Set SC_PATCH_S3_ACCESS_KEY}
  SC_PATCH_S3_SECRET_KEY: ${SC_PATCH_S3_SECRET_KEY:?Set SC_PATCH_S3_SECRET_KEY}
  SC_PATCH_S3_BUCKET: ${SC_PATCH_S3_BUCKET:-sc-patch-images}
  SC_REVIEW_S3_ENDPOINT: ${SC_REVIEW_S3_ENDPOINT:-minio:9000}
  SC_REVIEW_S3_ACCESS_KEY: ${SC_REVIEW_S3_ACCESS_KEY:?Set SC_REVIEW_S3_ACCESS_KEY}
  SC_REVIEW_S3_SECRET_KEY: ${SC_REVIEW_S3_SECRET_KEY:?Set SC_REVIEW_S3_SECRET_KEY}
  SC_REVIEW_S3_BUCKET: ${SC_REVIEW_S3_BUCKET:-sc-review-images}
  SC_UPSTREAM_ADDR: ${SC_UPSTREAM_ADDR:-sc-upstream:9091}
  SC_UPSTREAM_FLIGHT_ADDR: ${SC_UPSTREAM_FLIGHT_ADDR:-grpc://sc-upstream:9093}
  IMAGE_PARSER_GRPC_ADDR: image-parser:9092
  SC_DATA_PROVIDER_CACHE_DIR: /mnt/sc-data-provider-cache
  SC_DATA_PROVIDER_CACHE_NAMESPACE: sc-data-provider
  PLATFORM_API_URL: http://api:8000
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}

services:
  prefect-server:
    image: prefecthq/prefect:3.6.25-python3.12
    deploy:
      resources:
        limits:
          memory: ${PREFECT_SERVER_MEMORY:-4g}
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_DATABASE_URL:?Set PREFECT_DATABASE_URL}
      PREFECT_SERVER_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING:?Set PREFECT_SERVER_API_AUTH_STRING}
    expose:
      - "4200"
    networks:
      finetune-prod:
        aliases:
          - prefect-server
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import base64, os, urllib.request; request = urllib.request.Request('http://localhost:4200/api/health'); request.add_header('Authorization', 'Basic ' + base64.b64encode(os.environ['PREFECT_SERVER_API_AUTH_STRING'].encode()).decode()); urllib.request.urlopen(request)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    image: ${FINETUNE_API_IMAGE:?Set FINETUNE_API_IMAGE to an immutable tag}
    environment: *platform-environment
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY:-8g}
    shm_size: ${API_SHM_SIZE:-1g}
    depends_on:
      prefect-server:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
    networks:
      finetune-prod:
        aliases:
          - api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  sc-data-provider:
    image: ${FINETUNE_API_IMAGE:?Set FINETUNE_API_IMAGE to an immutable tag}
    command:
      [
        "/app/.venv/bin/uvicorn",
        "app.sc_data_provider_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--workers",
        "4",
      ]
    environment: *platform-environment
    deploy:
      resources:
        limits:
          memory: 6144m
    shm_size: ${SC_DATA_PROVIDER_SHM_SIZE:-1g}
    depends_on:
      prefect-server:
        condition: service_healthy
    expose:
      - "8001"
    volumes:
      - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
    networks:
      finetune-prod:
        aliases:
          - sc-data-provider
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  web:
    image: ${FINETUNE_WEB_IMAGE:?Set FINETUNE_WEB_IMAGE to an immutable tag}
    environment:
      OPERATOR_PREFECT_UI_URL: ${OPERATOR_PREFECT_UI_URL:-}
      OPERATOR_MINIO_CONSOLE_URL: ${OPERATOR_MINIO_CONSOLE_URL:-}
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY:-1g}
    depends_on:
      api:
        condition: service_healthy
      sc-data-provider:
        condition: service_healthy
    expose:
      - "80"
    networks:
      finetune-prod:
        aliases:
          - web
    restart: unless-stopped

  prefect-worker-cpu:
    image: ${FINETUNE_CPU_WORKER_IMAGE:?Set FINETUNE_CPU_WORKER_IMAGE to an immutable tag}
    environment:
      <<: *platform-environment
      PREFECT_WORKER_LIMIT: ${CPU_PREFECT_WORKER_LIMIT:-2}
    deploy:
      resources:
        limits:
          memory: ${CPU_WORKER_MEMORY:-8g}
    shm_size: ${CPU_WORKER_SHM_SIZE:-1g}
    depends_on:
      prefect-server:
        condition: service_healthy
    volumes:
      - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
    networks:
      finetune-prod:
    restart: unless-stopped

  prefect-worker-gpu:
    image: ${FINETUNE_GPU_WORKER_IMAGE:?Set FINETUNE_GPU_WORKER_IMAGE to an immutable tag}
    profiles: ["gpu"]
    environment:
      <<: *platform-environment
      PREFECT_WORKER_LIMIT: ${GPU_PREFECT_WORKER_LIMIT:-1}
    shm_size: ${GPU_WORKER_SHM_SIZE:-2g}
    depends_on:
      prefect-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${GPU_WORKER_MEMORY:-16g}
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${PLATFORM_DATA_DIR:-./data/platform}:/mnt
      - ${IMAGE_PARSER_DATA_DIR:-./data/image-parser}:/data:ro
    networks:
      finetune-prod:
    restart: unless-stopped

  sc-upstream:
    image: ${SC_UPSTREAM_IMAGE:?Set SC_UPSTREAM_IMAGE to an immutable tag}
    environment:
      GRPC_PORT: "9091"
      FLIGHT_PORT: "9093"
      UPSTREAM_DB_URL: ${UPSTREAM_DB_URL:?Set UPSTREAM_DB_URL}
      ZIPS_DB_URL: ${ZIPS_DB_URL:-}
      CACHE_DIR: /data/cache
      SC_UPSTREAM_CACHE_SIZE_LIMIT_BYTES: ${SC_UPSTREAM_CACHE_SIZE_LIMIT_BYTES:-10737418240}
      SC_UPSTREAM_RAW_CACHE_CLEANUP_INTERVAL_SECONDS: ${SC_UPSTREAM_RAW_CACHE_CLEANUP_INTERVAL_SECONDS:-7200}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    deploy:
      resources:
        limits:
          memory: ${SC_UPSTREAM_MEMORY:-8g}
    shm_size: ${SC_UPSTREAM_SHM_SIZE:-1g}
    expose:
      - "9091"
      - "9093"
    volumes:
      - ${SC_UPSTREAM_DATA_DIR:-./data/sc-upstream}:/data
    networks:
      finetune-prod:
        aliases:
          - sc-upstream
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('localhost', 9091), timeout=20); s.close()",
        ]
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  image-parser:
    image: ${IMAGE_PARSER_IMAGE:?Set IMAGE_PARSER_IMAGE to an immutable tag}
    depends_on:
      - sc-upstream
    environment:
      PORT: "8090"
      GRPC_PORT: "9092"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      SC_UPSTREAM_ADDR: ${SC_UPSTREAM_ADDR:-sc-upstream:9091}
      SC_PATCH_S3_ENDPOINT: ${SC_PATCH_S3_ENDPOINT:?Set SC_PATCH_S3_ENDPOINT}
      SC_PATCH_S3_REGION: ${SC_PATCH_S3_REGION:?Set SC_PATCH_S3_REGION}
      SC_PATCH_S3_ACCESS_KEY: ${SC_PATCH_S3_ACCESS_KEY:?Set SC_PATCH_S3_ACCESS_KEY}
      SC_PATCH_S3_SECRET_KEY: ${SC_PATCH_S3_SECRET_KEY:?Set SC_PATCH_S3_SECRET_KEY}
      SC_REVIEW_S3_ENDPOINT: ${SC_REVIEW_S3_ENDPOINT:?Set SC_REVIEW_S3_ENDPOINT}
      SC_REVIEW_S3_REGION: ${SC_REVIEW_S3_REGION:?Set SC_REVIEW_S3_REGION}
      SC_REVIEW_S3_ACCESS_KEY: ${SC_REVIEW_S3_ACCESS_KEY:?Set SC_REVIEW_S3_ACCESS_KEY}
      SC_REVIEW_S3_SECRET_KEY: ${SC_REVIEW_S3_SECRET_KEY:?Set SC_REVIEW_S3_SECRET_KEY}
      CACHE_DIR: /tmp/image-parser-cache
      CACHE_TTL: ${IMAGE_PARSER_CACHE_TTL:-10m}
      CACHE_CLEANUP_INTERVAL: ${IMAGE_PARSER_CACHE_CLEANUP_INTERVAL:-5m}
      CACHE_MAX_BYTES: ${IMAGE_PARSER_CACHE_MAX_BYTES:-34359738368}
      DISPLAY_CACHE_MAX_BYTES: ${IMAGE_PARSER_DISPLAY_CACHE_MAX_BYTES:-4294967296}
      PREDICTION_CACHE_MAX_BYTES: ${IMAGE_PARSER_PREDICTION_CACHE_MAX_BYTES:-25769803776}
      TRAINING_CACHE_MAX_BYTES: ${IMAGE_PARSER_TRAINING_CACHE_MAX_BYTES:-4294967296}
      EXPORT_CACHE_MAX_BYTES: ${IMAGE_PARSER_EXPORT_CACHE_MAX_BYTES:-4294967296}
    deploy:
      resources:
        limits:
          memory: ${IMAGE_PARSER_MEMORY:-32g}
    shm_size: ${IMAGE_PARSER_SHM_SIZE:-2g}
    expose:
      - "8090"
      - "9092"
    volumes:
      - ${IMAGE_PARSER_DATA_DIR:-./data/image-parser}:/data
    networks:
      finetune-prod:
        aliases:
          - image-parser
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  finetune-prod:
    external: true
    name: ${PLATFORM_NETWORK_NAME:?Set PLATFORM_NETWORK_NAME}
