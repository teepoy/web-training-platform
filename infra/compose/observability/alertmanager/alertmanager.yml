route:
  receiver: 'dev-null'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: 'dev-null'

  # Uncomment and configure for production alerting.
  # Example webhook receiver (e.g. for Slack via incoming webhooks or a generic relay):
  # - name: 'webhook'
  #   webhook_configs:
  #     - url: 'http://your-webhook-endpoint/alert'
  #       send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
