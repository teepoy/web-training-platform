stages:
  - check
  - test
  - test-frontend

variables:
  UV_CACHE_DIR: .uv-cache

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .venv/
    - .uv-cache/

.default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  before_script:
    - uv sync --frozen
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

.frontend:
  image: node:22-bookworm
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  cache:
    key: ${CI_COMMIT_REF_SLUG}-pnpm
    paths:
      - node_modules/
      - apps/*/node_modules/
      - libs/*/node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Python checks ──────────────────────────────────

ruff:
  extends: .default
  stage: check
  script:
    - uv run ruff check apps/api/

pyright:
  extends: .default
  stage: check
  script:
    - uv run --directory apps/api pyright .

# ── Python tests ───────────────────────────────────

api-tests:
  extends: .default
  stage: test
  script:
    - uv run pytest apps/api/

# ── Frontend tests ─────────────────────────────────

widget-sdk-tests:
  extends: .frontend
  stage: test-frontend
  script:
    - pnpm test:widget-sdk

web-ui-tests:
  extends: .frontend
  stage: test-frontend
  script:
    - pnpm test:web-ui

web-tests:
  extends: .frontend
  stage: test-frontend
  script:
    - pnpm test:web
