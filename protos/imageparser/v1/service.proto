syntax = "proto3";

package imageparser.v1;

option go_package = "ft-platform/protos/gen/go/imageparser/v1;imageparserv1";

service ImageParser {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc StreamPredictionImages(stream StreamImagesRequest) returns (stream StreamImagesResponse);
  rpc StreamTrainingImages(stream StreamImagesRequest) returns (stream StreamImagesResponse);
  rpc StreamExportImages(stream StreamImagesRequest) returns (stream StreamImagesResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

message StreamImagesRequest {
  oneof payload {
    OpenImageContext open_context = 1;
    ImageSampleBatchRequest sample_batch = 2;
    CloseImageContext close_context = 3;
  }
}

message OpenImageContext {
  string context_id = 1;
  string inspection_time = 2;
  int32 wafer_key = 3;
  repeated string roles = 4;
}

message ImageSampleRequest {
  uint64 sequence = 1;
  string sample_id = 2;
  string defect_id = 3;
}

message ImageSampleBatchRequest {
  string context_id = 1;
  repeated ImageSampleRequest samples = 2;
}

message CloseImageContext {
  string context_id = 1;
}

message StreamImagesResponse {
  oneof payload {
    ImageContextOpened context_opened = 1;
    ImageSampleBatchResponse sample_batch = 2;
    ImageContextError context_error = 3;
    ImageContextClosed context_closed = 4;
  }
}

message ImageStreamLimits {
  uint32 max_batch_items = 1;
  uint64 max_response_bytes = 2;
  uint32 max_active_contexts = 3;
  uint32 max_in_flight_batches = 4;
}

message ImageContextOpened {
  string context_id = 1;
  string eqp_id = 2;
  ImageStreamLimits limits = 3;
}

message ImageRoleResult {
  string role = 1;
  bytes image_data = 2;
  string content_type = 3;
  string error = 4;
}

message ImageSampleResult {
  uint64 sequence = 1;
  string sample_id = 2;
  string defect_id = 3;
  repeated ImageRoleResult images = 4;
  string error = 5;
}

message ImageSampleBatchResponse {
  string context_id = 1;
  repeated ImageSampleResult samples = 2;
  uint64 ack_sequence = 3;
}

message ImageContextError {
  string context_id = 1;
  string code = 2;
  string error = 3;
}

message ImageContextClosed {
  string context_id = 1;
}
