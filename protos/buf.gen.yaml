version: v1
plugins:
  - plugin: mypy
    out: ../libs/protos/src/proto_stubs
    path: ../.venv/bin/protoc-gen-mypy
  - plugin: es
    out: ../apps/web/src/features/sc/generated/proto
    opt: target=ts
    path: ../apps/web/node_modules/.bin/protoc-gen-es
  - plugin: go
    out: ../services/image-parser/gen/go
    opt: paths=source_relative
  - plugin: go-grpc
    out: ../services/image-parser/gen/go
    opt: paths=source_relative
