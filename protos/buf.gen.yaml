version: v1
plugins:
  - name: python
    out: ../libs/protos/src/proto_stubs
  - plugin: mypy
    out: ../libs/protos/src/proto_stubs
  - plugin: es
    out: ../apps/web/src/features/sc/generated/proto
    opt: target=ts
    path: protoc-gen-es
  - plugin: go
    out: ../services/image-parser/gen/go
    opt: paths=source_relative
    path: protoc-gen-go
  - plugin: go-grpc
    out: ../services/image-parser/gen/go
    opt: paths=source_relative
    path: protoc-gen-go-grpc
