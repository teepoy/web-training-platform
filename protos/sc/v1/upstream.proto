syntax = "proto3";

package sc.v1;

option go_package = "ft-platform/protos/gen/go/sc/v1;scv1";

service ScUpstream {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetInspection(GetInspectionRequest) returns (GetInspectionResponse);
  rpc GetInspectionPatchZips(GetInspectionPatchZipsRequest) returns (GetInspectionPatchZipsResponse);
  rpc GetReviewImageFileSpec(GetReviewImageFileSpecRequest) returns (GetReviewImageFileSpecResponse);
  rpc ListReviewImages(ListReviewImagesRequest) returns (ListReviewImagesResponse);
  rpc ListInspections(ListInspectionsRequest) returns (ListInspectionsResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

message GetInspectionRequest {
  string inspection_time = 1;
  int32 wafer_key = 2;
}

message GetInspectionResponse {
  string inspection_time = 1;
  int32 wafer_key = 2;
  string lot_id = 3;
  string wafer_id = 4;
  string device = 5;
  string layer_id = 6;
  int32 center_x = 7;
  int32 center_y = 8;
  int32 origin_x = 9;
  int32 origin_y = 10;
  int32 die_size_x = 11;
  int32 die_size_y = 12;
  string eqp_id = 13;
  string recipe_id = 14;
  int32 defects = 15;
  int32 images = 16;
  int32 origin_index_x = 17;
  int32 origin_index_y = 18;
  int32 latest_update = 19;
}

message GetInspectionPatchZipsRequest {
  string inspection_time = 1;
  string lot_id = 2;
  string wafer_id = 3;
  string device = 4;
  string layer_id = 5;
}

message ZipRef {
  string s3_bucket = 1;
  string s3_key = 2;
}

message GetInspectionPatchZipsResponse {
  repeated ZipRef zips = 1;
}

message GetReviewImageFileSpecRequest {
  string inspection_time = 1;
  int32 wafer_key = 2;
  int32 defect_id = 3;
  int32 image_id = 4;
}

message GetReviewImageFileSpecResponse {
  string image_filespec = 1;
}

message ListReviewImagesRequest {
  string inspection_time = 1;
  int32 wafer_key = 2;
  int32 defect_id = 3;
}

message ReviewImageRef {
  string image_filespec = 1;
  int32 defect_id = 2;
  int32 image_id = 3;
  string image_type = 4;
}

message ListReviewImagesResponse {
  repeated ReviewImageRef images = 1;
}

message ListInspectionsRequest {
  string start_time = 1;
  string end_time = 2;
  string lot_id = 3;
  string wafer_id = 4;
  string layer_id = 5;
  string device = 6;
}

message InspectionSummary {
  string inspection_time = 1;
  int32 wafer_key = 2;
  string lot_id = 3;
  string wafer_id = 4;
  string device = 5;
  string layer_id = 6;
  string eqp_id = 7;
  string recipe_id = 8;
  int32 defects = 9;
  int32 images = 10;
  int32 center_x = 11;
  int32 center_y = 12;
  int32 origin_x = 13;
  int32 origin_y = 14;
  int32 die_size_x = 15;
  int32 die_size_y = 16;
  int32 origin_index_x = 17;
  int32 origin_index_y = 18;
}

message ListInspectionsResponse {
  repeated InspectionSummary items = 1;
}
