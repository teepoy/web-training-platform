repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/boidolr/ast-grep-pre-commit
    rev: 0.42.3
    hooks:
      - id: ast-grep

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run --directory apps/api pyright .
        language: system
        pass_filenames: false

      - id: vue-tsc
        name: vue-tsc
        entry: bash -c 'cd apps/web && pnpm vue-tsc -b --noEmit'
        language: system
        pass_filenames: false

      - id: prettier-check
        name: prettier-check
        entry: pnpm exec prettier --check
        language: system
        files: ^apps/web/.*\.(vue|ts|tsx|js|jsx|css|scss|json|yaml|yml|md)$
        exclude: ^apps/web/src/generated/orval/
        pass_filenames: true
