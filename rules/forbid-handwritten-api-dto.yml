id: forbid-handwritten-api-dto
language: typescript
severity: error
ignores:
  - "**/generated/**"
  - "**/*.spec.ts"
  - "**/e2e/**"
  - "**/shared/api/**"
  - "**/tests/**"
  - "**/src/testing/**"
  - "**/sc/api/**"
rule:
  any:
    - kind: interface_declaration
      has:
        field: name
        stopBy: end
        regex: "Response$"
    - kind: interface_declaration
      has:
        field: name
        stopBy: end
        regex: "Request$"
    - kind: call_expression
      has:
        field: function
        stopBy: end
        regex: "^req$"
message: |
  Handwritten API DTOs and raw req() calls are disallowed.
  Use the orval-generated client instead.
