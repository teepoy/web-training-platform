id: dataset_size_sensor
name: Dataset Size Sensor
description: Polls dataset sample counts and emits events when count changes
cron: "*/5 * * * *"
available_triggers:
  - train
  - predict
filter_schema:
  type: object
  properties:
    dataset_id:
      type: string
      description: Filter to a specific dataset ID
    min_sample_count:
      type: integer
      description: Only trigger when sample count exceeds this threshold
  additionalProperties: false
