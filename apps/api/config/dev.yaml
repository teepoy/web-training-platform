  external_url: "http://localhost:8080"
  api_key: "ls-smoke-token-for-local-dev"
  database_url: "postgresql+asyncpg://postgres:postgres@localhost:5432/labelstudio"

sc:
  mock:
    db_url: "sqlite:////app/apps/api/wafer_inspection.db"
