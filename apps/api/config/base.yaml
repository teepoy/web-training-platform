app:
  env: dev
  frontend_url: ""

execution:
  engine: local
  status_reconcile_interval_seconds: 2

logging:
  level: INFO

db:
  url: ""
  echo: false
  auto_create: false

storage:
  kind: minio
  sparse_manifest_cache_max_bytes: 16777216
  minio:
    endpoint: ""
    access_key: ""
    secret_key: ""
    bucket: "finetune-artifacts"
    secure: false
    lifecycle:
      exports:
        enabled: true
        prefix: "exports/"
        expiration_days: 1
  runtime_bucket: "finetune-runtime-inputs"

k8s:
  namespace: "default"
  incluster: false
  kubeconfig: null

kubeflow:
  group: "kubeflow.org"
  version: "v1"
  plural: "pytorchjobs"
  image: "python:3.11-slim"

notification:
  webhook:
    endpoint: "http://localhost:9000/hooks/training"
    timeout_seconds: 5

oauth:
  enabled: false
  state_secret: ""
  providers:
    google:
      display_name: "Google"
      enabled: false
      client_id: ""
      client_secret: ""
      authorize_url: "https://accounts.google.com/o/oauth2/v2/auth"
      token_url: "https://oauth2.googleapis.com/token"
      userinfo_url: "https://www.googleapis.com/oauth2/v3/userinfo"
      scopes: ["openid", "email", "profile"]
    github:
      display_name: "GitHub"
      enabled: false
      client_id: ""
      client_secret: ""
      authorize_url: "https://github.com/login/oauth/authorize"
      token_url: "https://github.com/login/oauth/access_token"
      userinfo_url: "https://api.github.com/user"
      user_emails_url: "https://api.github.com/user/emails"
      scopes: ["user:email"]

    custom:
      display_name: "Custom SSO"
      enabled: false
      client_id: ""
      client_secret: ""
      authorize_url: ""
      token_url: ""
      scopes: ["openid", "email", "profile"]
      user_mapping:
        email: "email"
        name: "name"
        provider_id: "sub"

prefect:
  api_url: ""
  ui_url: ""

llm:
  # litellm-backed.  Model string controls provider routing:
  #   "gpt-4o-mini"             → OpenAI
  #   "qwen/qwen-max"           → Alibaba Qwen
  #   "gemini/gemini-2.0-flash" → Google Gemini
  #   "anthropic/claude-sonnet" → Anthropic
  # Set base_url only for custom/self-hosted OpenAI-compatible endpoints.
  base_url: ""
  api_key: ""
  model: "qwen/qwen-max"
  timeout_seconds: 30

label_studio:
  url: ""
  external_url: ""
  api_key: ""
  database_url: ""

agent:
  enabled: true
  metadata_sample_size: 100

prediction:
  compaction_memory_limit: 512MiB
  compaction_temp_limit: 4GiB
  compaction_row_group_rows: 100000

dataset_transfer:
  annotation_import_max_bytes: 67108864
  annotation_import_max_records: 300000
  annotation_batch_rows: 1000
  parquet_import_max_bytes: 536870912
  parquet_import_max_rows: 300000

redis:
  host: ""
  port: 6379
  db: 0
  password: ""

startup_checks:
  dependency_timeout_seconds: 5

sc:
  upstream:
    grpc_addr: ""
    flight_addr: ""
  image_parser:
    grpc_addr: ""
  pipeline:
    import_batch_rows: 25000
    index_row_group_rows: 65536
    materialization_batch_rows: 512
    materialization_max_error_records: 1000
    prediction_input_batch_rows: 512
    prediction_preprocess_task_rows: 64
    prediction_preprocess_workers: 4
    prediction_preprocess_prefetch_tasks: 8
    prediction_progress_flush_rows: 5000
    prediction_progress_flush_seconds: 5.0
    prediction_write_batch_rows: 5000
    training_max_rows: 100000
    training_max_materialized_bytes: 8589934592
    training_shuffle_seed: 0
  data_provider:
    implementation: duckdb
    classify_max_rows: 300000
    max_compressed_request_bytes: 16777216
    max_decompressed_request_bytes: 67108864
    max_rss_mb: 1536
    revision_namespace: sc-data-provider
    duckdb_memory_limit: 1GiB
    duckdb_threads: 1
    duckdb_temp_directory_size: 2GiB
    duckdb_allocator_background_threads: true
    duckdb_preserve_insertion_order: false
    duckdb_allocator_flush_threshold: 64MiB
    duckdb_allocator_bulk_deallocation_flush_threshold: 128MiB
    connection_recycle_rss_mb: 1280
    worker_count: 1
    container_memory_limit_mb: 2048
    python_overhead_mb: 256
    service_headroom_mb: 256
    object_cache_max_bytes: 10737418240
    object_cache_low_watermark_bytes: 8589934592
    object_idle_ttl_seconds: 3600
    cleanup_interval_seconds: 60
    stale_write_seconds: 300
    lease_ttl_seconds: 60
    lease_heartbeat_seconds: 20
    build_lock_ttl_seconds: 60
    build_lock_heartbeat_seconds: 20
    build_wait_timeout_seconds: 30
    build_poll_interval_ms: 100
    sql_timeout_seconds: 30
    max_response_bytes: 268435456
    arrow_batch_rows: 16384
    stream_queue_capacity: 8
    stream_queue_poll_interval_ms: 100
    sse_heartbeat_seconds: 15
    sse_max_connection_seconds: 60

auth:
  jwt_secret_key: ""
  jwt_algorithm: "HS256"
  access_token_expire_minutes: 60
