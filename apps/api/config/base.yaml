app:
  name: online-finetune-api
  env: dev
  frontend_url: "http://localhost:5173"

execution:
  engine: local

db:
  url: "sqlite+aiosqlite:///./finetune.db"
  echo: false
  auto_create: false

storage:
  kind: minio
  minio:
    endpoint: "localhost:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "finetune-artifacts"
    secure: false
    lifecycle:
      exports:
        enabled: true
        prefix: "exports/"
        expiration_days: 1
        abort_incomplete_multipart_upload_days: 1
  runtime_bucket: "finetune-runtime-inputs"

k8s:
  namespace: "default"
  incluster: false
  kubeconfig: null

kubeflow:
  group: "kubeflow.org"
  version: "v1"
  plural: "pytorchjobs"
  image: "python:3.11-slim"

notification:
  sink: webhook
  webhook:
    endpoint: "http://localhost:9000/hooks/training"
    timeout_seconds: 5

oauth:
  enabled: false
  state_secret: "replace-me-in-production"
  providers:
    google:
      display_name: "Google"
      enabled: false
      client_id: ""
      client_secret: ""
      authorize_url: "https://accounts.google.com/o/oauth2/v2/auth"
      token_url: "https://oauth2.googleapis.com/token"
      userinfo_url: "https://www.googleapis.com/oauth2/v3/userinfo"
      scopes: ["openid", "email", "profile"]
    github:
      display_name: "GitHub"
      enabled: false
      client_id: ""
      client_secret: ""
      authorize_url: "https://github.com/login/oauth/authorize"
      token_url: "https://github.com/login/oauth/access_token"
      userinfo_url: "https://api.github.com/user"
      user_emails_url: "https://api.github.com/user/emails"
      scopes: ["user:email"]

    custom:
      display_name: "Custom SSO"
      enabled: false
      client_id: ""
      client_secret: ""
      authorize_url: ""
      token_url: ""
      scopes: ["openid", "email", "profile"]
      user_mapping:
        email: "email"
        name: "name"
        provider_id: "sub"

prefect:
  api_url: "http://localhost:4200/api"
  ui_url: "http://localhost:4200"
  work_pool_name: "default-cpu"
  work_pool_type: "process"
  flow_name: "train-job"
  concurrency_limit: 1

runtime_routing:
  training_routes:
    resnet50-sc-v1:
      deployment: "train-job-deployment"
      input_contract: "sc.patch_image.v1"
      output_contract: "sc.resnet50.model.v1"
      resource_profile: "gpu"
      owner: "local_compat"
      algo_id: "resnet50-sc"
      algo_version: "1"
      missing_image_policy: "fail"
    yolo-sc-v1:
      deployment: "train-job-deployment"
      input_contract: "sc.patch_image.v1"
      output_contract: "sc.yolo.model.v1"
      resource_profile: "gpu"
      owner: "local_compat"
      algo_id: "yolo-sc"
      algo_version: "1"
      missing_image_policy: "fail"
  train_and_predict_routes:
    resnet50-sc-v1:
      deployment: "train-and-predict-deployment"
      input_contract: "sc.patch_image.v1"
      output_contract: "sample.predictions.v1"
      resource_profile: "gpu"
      owner: "local_compat"
      algo_id: "resnet50-sc"
      algo_version: "1"
      missing_image_policy: "skip"
    yolo-sc-v1:
      deployment: "train-and-predict-deployment"
      input_contract: "sc.patch_image.v1"
      output_contract: "sample.predictions.v1"
      resource_profile: "gpu"
      owner: "local_compat"
      algo_id: "yolo-sc"
      algo_version: "1"
      missing_image_policy: "skip"
  prediction_routes:
    resnet50-sc-v1:
      deployment: "predict-job-batch-deployment"
      input_contract: "sc.patch_image.v1"
      output_contract: "sample.predictions.v1"
      resource_profile: "gpu"
      owner: "local_compat"
      algo_id: "resnet50-sc"
      algo_version: "1"
      missing_image_policy: "skip"
    yolo-sc-v1:
      deployment: "predict-job-batch-deployment"
      input_contract: "sc.patch_image.v1"
      output_contract: "sample.predictions.v1"
      resource_profile: "gpu"
      owner: "local_compat"
      algo_id: "yolo-sc"
      algo_version: "1"
      missing_image_policy: "skip"
llm:
  # litellm-backed.  Model string controls provider routing:
  #   "gpt-4o-mini"             → OpenAI
  #   "qwen/qwen-max"           → Alibaba Qwen
  #   "gemini/gemini-2.0-flash" → Google Gemini
  #   "anthropic/claude-sonnet" → Anthropic
  # Set base_url only for custom/self-hosted OpenAI-compatible endpoints.
  base_url: ""
  api_key: ""
  model: "qwen/qwen-max"
  timeout_seconds: 30

label_studio:
  url: ""
  external_url: ""
  api_key: ""
  database_url: ""

data:
  dir: ""

sensors:
  dir: "sensors"
  strict: false

agent:
  enabled: true
  max_panels: 8
  metadata_sample_size: 100

redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""

auth:
  enabled: true
  jwt_secret_key: "replace-me-in-production"
  jwt_algorithm: "HS256"
  access_token_expire_minutes: 60
