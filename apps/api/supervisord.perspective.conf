[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord-perspective.pid

[program:perspective-ws]
command=/app/apps/api/scripts/run_perspective_worker.sh %(process_num)s
process_name=perspective-ws-%(process_num)d
numprocs=4
numprocs_start=0
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
