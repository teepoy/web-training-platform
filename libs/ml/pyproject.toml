[project]
name = "finetune-ml"
version = "0.1.0"
description = "ML task implementations for the finetune platform — trainers, predictors, configs"
requires-python = ">=3.11"
dependencies = ["platform-runtime", "pillow==12.2.0"]

[tool.uv.sources]
platform-runtime = { workspace = true }

[tool.pyright]
extraPaths = ["../platform-runtime/src"]

[project.optional-dependencies]
cpu = []
torch = ["torch==2.9.1"]
transformers = ["transformers==5.5.0"]
all = ["finetune-ml[torch,transformers]"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "libs"
module-root = ""
