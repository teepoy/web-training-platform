[project]
name = "seedmaker"
version = "0.1.0"
description = "Unified dataset seeding CLI and framework for the finetune platform"
requires-python = ">=3.11"
dependencies = [
    "finetune-api",
    "httpx==0.28.1",
    "pillow>=12.2.0",
]

[project.optional-dependencies]
real = [
    "datasets==4.8.5",
    "Pillow==12.2.0",
    "torch==2.9.1",
    "torchvision>=0.20.0",
]
s3 = ["boto3>=1"]

[project.scripts]
seedmaker = "seedmaker.cli:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.sources]
finetune-api = { workspace = true }
