[project]
name = "seedmaker"
version = "0.1.0"
description = "Unified dataset seeding CLI and framework for the finetune platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
]

[project.optional-dependencies]
real = [
    "datasets",
    "Pillow",
    "torch",
    "torchvision",
]
s3 = [
    "boto3",
]

[project.scripts]
seedmaker = "seedmaker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seedmaker"]
