[project]
name = "platform-runtime"
version = "0.1.0"
description = "Platform runtime package for boundary migration"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "pyarrow==24.0.0",
  "pydantic==2.12.5",
  "typer==0.23.1",
]

[project.scripts]
ftctl = "platform_runtime.sdk.cli:app"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
faulthandler_timeout = 60
asyncio_mode = "auto"
